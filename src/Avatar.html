<script>
/* =====================================================================
 * Astronauta 3D (Three.js r128), versión detallada.
 * - Iluminación de estudio (entorno PMREM), tone mapping ACES y sombras.
 * - Traje con juntas de fuelle, guantes con dedos, botas con suela,
 *   mochila de soporte vital (PLSS), módulo de pecho (DCM) y mangueras.
 * - Cabeza modelada con ojos, párpados, cejas y labios; 6 peinados.
 * - Casco de burbuja con carcasa, visera dorada, lámparas y anillo de cuello.
 * Personalizable: piel, peinado, color de pelo, expresión, traje y casco.
 * El galón de los hombros muestra el rango de la tripulación (dibujarGalon).
 * ===================================================================== */

const AVATAR_OPCIONES = {
  piel: ['#fbe0cc', '#f1c9a5', '#e0ac69', '#c68642', '#8d5524', '#5c3a21'],
  pelo: [
    { id: 'corto', n: 'Corto' }, { id: 'largo', n: 'Largo' }, { id: 'coleta', n: 'Coleta' },
    { id: 'mono', n: 'Moño' }, { id: 'rizado', n: 'Rizado' }, { id: 'rapado', n: 'Rapado' }
  ],
  colorPelo: ['#1b1b1b', '#4a2c17', '#8b5a2b', '#d9b26f', '#b5452f', '#e8e8e8', '#5b6cff', '#e85d9a'],
  cara: [
    { id: 'sonriente', n: 'Sonriente' }, { id: 'seria', n: 'Seria' }, { id: 'guino', n: 'Guiño' },
    { id: 'sorpresa', n: 'Sorpresa' }, { id: 'gafas', n: 'Gafas' }
  ],
  traje: ['#f1f3f5', '#ff7a1a', '#2f6fed', '#2bb673', '#8e44ad', '#e63946', '#ffd23f', '#2b2d42'],
  casco: ['#ff7a1a', '#f1f3f5', '#2f6fed', '#2bb673', '#8e44ad', '#e63946', '#ffd23f', '#2b2d42']
};

const COLORES_TRAJE = { '#f1f3f5': 'Blanco orbital', '#ff7a1a': 'Naranja baliza', '#2f6fed': 'Azul cobalto', '#2bb673': 'Verde clorofila',
  '#8e44ad': 'Violeta nebulosa', '#e63946': 'Rojo Marte', '#ffd23f': 'Amarillo solar', '#2b2d42': 'Grafito' };
const AVATAR_NOMBRES = {
  piel: { '#fbe0cc': 'Tono I', '#f1c9a5': 'Tono II', '#e0ac69': 'Tono III', '#c68642': 'Tono IV', '#8d5524': 'Tono V', '#5c3a21': 'Tono VI' },
  colorPelo: { '#1b1b1b': 'Negro', '#4a2c17': 'Castaño', '#8b5a2b': 'Avellana', '#d9b26f': 'Rubio', '#b5452f': 'Cobrizo',
    '#e8e8e8': 'Plata', '#5b6cff': 'Azul eléctrico', '#e85d9a': 'Rosa neón' },
  traje: COLORES_TRAJE,
  casco: COLORES_TRAJE
};

const AVATAR_DEFECTO = { piel: '#f1c9a5', pelo: 'corto', colorPelo: '#4a2c17', cara: 'sonriente', traje: '#f1f3f5', casco: '#ff7a1a' };

function avatarAleatorio() {
  const r = l => l[Math.floor(Math.random() * l.length)];
  return {
    piel: r(AVATAR_OPCIONES.piel), pelo: r(AVATAR_OPCIONES.pelo).id, colorPelo: r(AVATAR_OPCIONES.colorPelo),
    cara: r(AVATAR_OPCIONES.cara).id, traje: r(AVATAR_OPCIONES.traje), casco: r(AVATAR_OPCIONES.casco)
  };
}

/* ------------------------------------------------------------------ */
/* Visor: renderer, cámara, luces, rotación                            */
/* ------------------------------------------------------------------ */

/**
 * Galón de rango sobre un lienzo (escudo de 40 × 48 unidades escalado a W × H).
 * nivel 0: Cadete (liso) · 1–3: chevrones plateados · 4–6: estrellas doradas · 7: Leyenda estelar.
 */
function dibujarGalon(ctx, nivel, W, H) {
  const s = Math.min(W / 40, H / 48);
  ctx.save();
  ctx.clearRect(0, 0, W, H);
  ctx.translate((W - 40 * s) / 2, (H - 48 * s) / 2);
  ctx.scale(s, s);
  const oro = nivel >= 4, leyenda = nivel >= 7;
  const metal = ctx.createLinearGradient(0, 4, 0, 44);
  if (leyenda) { metal.addColorStop(0, '#fff6c8'); metal.addColorStop(0.5, '#ffb92e'); metal.addColorStop(1, '#ff7ad9'); }
  else if (oro) { metal.addColorStop(0, '#fff1b8'); metal.addColorStop(0.55, '#ffcf5a'); metal.addColorStop(1, '#c98a14'); }
  else { metal.addColorStop(0, '#ffffff'); metal.addColorStop(0.55, '#cfd8e6'); metal.addColorStop(1, '#8592a6'); }
  // escudo
  const escudo = () => { ctx.beginPath(); ctx.moveTo(4, 3); ctx.lineTo(36, 3); ctx.lineTo(36, 31); ctx.lineTo(20, 45); ctx.lineTo(4, 31); ctx.closePath(); };
  if (leyenda) { ctx.shadowColor = 'rgba(255,185,46,0.9)'; ctx.shadowBlur = 8; }
  escudo();
  const fondo = ctx.createLinearGradient(0, 3, 0, 45);
  fondo.addColorStop(0, leyenda ? '#2a1450' : '#16244a'); fondo.addColorStop(1, leyenda ? '#120826' : '#070d1f');
  ctx.fillStyle = fondo; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 2.4; ctx.strokeStyle = metal; ctx.stroke();
  ctx.fillStyle = metal; ctx.strokeStyle = metal;
  const estrella = (cx, cy, r) => {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  };
  if (nivel <= 0) {
    ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(12, 21); ctx.lineTo(28, 21); ctx.stroke();       // Cadete: una barra fina
  } else if (nivel <= 3) {
    ctx.lineWidth = 3.6; ctx.lineJoin = 'miter';
    const y0 = nivel === 1 ? 17 : nivel === 2 ? 13 : 10;
    for (let i = 0; i < nivel; i++) { const y = y0 + i * 8; ctx.beginPath(); ctx.moveTo(10, y); ctx.lineTo(20, y + 7); ctx.lineTo(30, y); ctx.stroke(); }
  } else if (nivel <= 6) {
    const n = nivel - 3;
    if (n === 1) estrella(20, 21, 9);
    else if (n === 2) { estrella(13, 20, 6.5); estrella(27, 20, 6.5); }
    else { estrella(20, 13.5, 6); estrella(12.5, 25, 6); estrella(27.5, 25, 6); }
  } else {
    // Leyenda estelar: estrella grande con órbita
    ctx.lineWidth = 1.4; ctx.beginPath(); ctx.ellipse(20, 21, 14, 5.5, -0.35, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowColor = 'rgba(255,240,200,0.9)'; ctx.shadowBlur = 6;
    estrella(20, 21, 10);
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(32.5, 16.6, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function crearAvatar(contenedor, cfg, opciones) {
  const op = opciones || {};
  let config = Object.assign({}, AVATAR_DEFECTO, cfg || {});
  let galon = op.galon === undefined ? null : op.galon;
  let nombre = op.nombre || '';

  if (!window.THREE || !soportaWebGL_()) {
    contenedor.innerHTML = '<div style="display:grid;place-items:center;height:100%;font-size:' + (op.mini ? 30 : 120) + 'px">👩‍🚀</div>';
    return { actualizar() {}, ponerGalon() {}, ponerNombre() {}, pausar() {}, destruir() {} };
  }
  const T = THREE;

  const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = T.sRGBEncoding;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  if (!op.mini) {
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
  }
  contenedor.appendChild(renderer.domElement);

  const escena = new T.Scene();
  const pmrem = new T.PMREMGenerator(renderer);
  const estudio = escenaEstudio_();
  const entorno = pmrem.fromScene(estudio, 0.04).texture;
  liberar_(estudio);
  escena.environment = entorno;

  const camara = new T.PerspectiveCamera(op.mini ? 22 : 28, 1, 0.1, 60);
  if (op.mini) { camara.position.set(0, 2.98, 2.9); camara.lookAt(0, 2.8, 0); }
  else { camara.position.set(0, 2.1, 9.6); camara.lookAt(0, 1.55, 0); }

  // Luces: clave cálida con sombras, relleno frío y contraluz cian (tono HUD)
  escena.add(new T.HemisphereLight(0xdfe8ff, 0x1c2238, 0.35));
  const clave = new T.DirectionalLight(0xfff4e6, 1.4);
  clave.position.set(2.6, 5.5, 4.2);
  if (!op.mini) {
    clave.castShadow = true;
    clave.shadow.mapSize.set(1024, 1024);
    Object.assign(clave.shadow.camera, { left: -2, right: 2, top: 4, bottom: -1, near: 0.5, far: 16 });
    clave.shadow.bias = -0.0004;
    clave.shadow.normalBias = 0.02;
  }
  escena.add(clave);
  const relleno = new T.DirectionalLight(0x9db8ff, 0.45);
  relleno.position.set(-4, 2, 3);
  escena.add(relleno);
  const contraluz = new T.DirectionalLight(0x5fd8ff, 1.1);
  contraluz.position.set(-2, 4, -5);
  escena.add(contraluz);

  const plataforma = op.plataforma ? crearPlataforma_() : null;
  if (plataforma) {
    escena.add(plataforma);
    const sombra = new T.Mesh(new T.CircleGeometry(1.4, 48), new T.ShadowMaterial({ opacity: 0.45 }));
    sombra.rotation.x = -Math.PI / 2;
    sombra.position.y = 0.004;
    sombra.receiveShadow = true;
    plataforma.add(sombra);
  }

  const pivote = new T.Group();
  escena.add(pivote);
  let modelo = construirAstronauta_(config, galon, nombre, !op.mini);
  pivote.add(modelo);

  // Rotación con el ratón / dedo
  let arrastrando = false, xPrevio = 0, giro = op.mini ? 0.35 : 0.45, ultimoArrastre = 0;
  if (!op.mini) {
    const el = renderer.domElement;
    el.style.touchAction = 'pan-y';         // girar con el dedo en horizontal sin bloquear el desplazamiento vertical
    el.addEventListener('pointerdown', e => { arrastrando = true; xPrevio = e.clientX; el.setPointerCapture(e.pointerId); });
    el.addEventListener('pointermove', e => {
      if (!arrastrando) return;
      giro += (e.clientX - xPrevio) * 0.012;
      xPrevio = e.clientX;
      ultimoArrastre = performance.now();
    });
    const soltar = () => { arrastrando = false; };
    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);
  }

  function ajustar() {
    const w = contenedor.clientWidth || 100, h = contenedor.clientHeight || 100;
    renderer.setSize(w, h);
    camara.aspect = w / h;
    if (op.plataforma) {
      // En escenas estrechas alejamos la cámara para que quepa la plataforma (semiancho ≈ 1,3)
      const tanMedio = Math.tan(T.MathUtils.degToRad(camara.fov / 2));
      const d = Math.max(9.6, 1.3 / (tanMedio * camara.aspect));
      camara.position.set(0, 2.1 * d / 9.6, d);
      camara.lookAt(0, 1.55, 0);
    }
    if (op.camara) { camara.position.fromArray(op.camara.pos); camara.lookAt(new T.Vector3().fromArray(op.camara.mira)); }
    camara.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(ajustar);
  ro.observe(contenedor);
  ajustar();

  let vivo = true, pausado = false;
  const t0 = performance.now();
  function bucle(ahora) {
    if (!vivo) return;
    if (pausado) { requestAnimationFrame(bucle); return; }
    const t = (ahora - t0) / 1000;
    const quieto = !arrastrando && ahora - ultimoArrastre > 2500;
    if (quieto) giro += (0.45 + Math.sin(t * 0.5) * 0.5 - giro) * 0.01;
    pivote.rotation.y = giro;
    pivote.position.y = Math.sin(t * 1.4) * 0.04;
    pivote.rotation.z = Math.sin(t * 0.9) * 0.015;
    if (plataforma) plataforma.rotation.y = t * 0.35;
    renderer.render(escena, camara);
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);

  function reconstruir() {
    pivote.remove(modelo);
    liberar_(modelo);
    modelo = construirAstronauta_(config, galon, nombre, !op.mini);
    pivote.add(modelo);
  }

  return {
    actualizar(nuevo) { config = Object.assign({}, config, nuevo); reconstruir(); },
    ponerGalon(nivel) { if (nivel === galon) return; galon = nivel; reconstruir(); },
    pausar(si) { pausado = !!si; },
    ponerNombre(n) { nombre = n || ''; if (modelo.userData.ponerNombre) modelo.userData.ponerNombre(nombre); },
    destruir() {
      vivo = false; ro.disconnect(); liberar_(modelo);
      if (plataforma) liberar_(plataforma);
      entorno.dispose(); pmrem.dispose();
      renderer.dispose();
      if (renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement);
    }
  };
}

/**
 * Retrato de un astronauta como imagen (data URL), con un único renderizador compartido: así se pueden
 * mostrar decenas de avatares (el navegador solo admite unas 16 escenas 3D a la vez).
 * encuadre: 'busto' (de cintura para arriba) o 'cuerpo'.
 */
const FOTOGRAFO_ = { r: null };
function fotografiarAvatar(cfg, galon, nombre, ancho, alto, encuadre) {
  if (!window.THREE || !soportaWebGL_()) return null;
  const T = THREE, F = FOTOGRAFO_;
  if (!F.r) {
    F.r = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    F.r.outputEncoding = T.sRGBEncoding;
    F.r.toneMapping = T.ACESFilmicToneMapping;
    F.r.toneMappingExposure = 1.0;
    F.escena = new T.Scene();
    const pmrem = new T.PMREMGenerator(F.r);
    const estudio = escenaEstudio_();
    F.escena.environment = pmrem.fromScene(estudio, 0.04).texture;
    liberar_(estudio);
    pmrem.dispose();
    // mismas luces que el editor (sin sombras)
    F.escena.add(new T.HemisphereLight(0xdfe8ff, 0x1c2238, 0.35));
    const clave = new T.DirectionalLight(0xfff4e6, 1.4); clave.position.set(2.6, 5.5, 4.2); F.escena.add(clave);
    const relleno = new T.DirectionalLight(0x9db8ff, 0.45); relleno.position.set(-4, 2, 3); F.escena.add(relleno);
    const contraluz = new T.DirectionalLight(0x5fd8ff, 1.1); contraluz.position.set(-2, 4, -5); F.escena.add(contraluz);
    F.camara = new T.PerspectiveCamera(24, 1, 0.1, 60);
  }
  F.r.setPixelRatio(1);
  F.r.setSize(ancho, alto, false);
  F.camara.aspect = ancho / alto;
  if (encuadre === 'cuerpo') { F.camara.fov = 26; F.camara.position.set(0, 1.9, 8.4); F.camara.lookAt(0, 1.62, 0); }
  else { F.camara.fov = 24; F.camara.position.set(0, 2.45, 5.6); F.camara.lookAt(0, 2.22, 0); }
  F.camara.updateProjectionMatrix();
  const modelo = construirAstronauta_(Object.assign({}, AVATAR_DEFECTO, cfg || {}), galon, nombre || '', false);
  modelo.rotation.y = 0.32;
  F.escena.add(modelo);
  F.r.render(F.escena, F.camara);
  const url = F.r.domElement.toDataURL('image/webp', 0.9);
  F.escena.remove(modelo);
  // el modelo anterior se libera después de dibujar este: así sus programas de sombreado siguen en uso
  // y no se recompilan en cada retrato (pasa de ~600 ms a unos pocos ms)
  if (F.anterior) liberar_(F.anterior);
  F.anterior = modelo;
  return url;
}

/** Sala virtual con paneles de luz: da reflejos creíbles al casco, la visera y el metal. */
function escenaEstudio_() {
  const T = THREE;
  const s = new T.Scene();
  s.add(new T.Mesh(new T.BoxGeometry(10, 10, 10), new T.MeshBasicMaterial({ color: 0x141a2e, side: T.BackSide })));
  const panel = (w, h, x, y, z, color, intensidad) => {
    const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: color, side: T.DoubleSide }));
    m.material.color.multiplyScalar(intensidad);
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    s.add(m);
  };
  panel(4, 2.5, 0, 3, 4.9, 0xffffff, 3.2);
  panel(5, 5, 0, 4.9, 0, 0xffffff, 1.4);
  panel(2.5, 3, 4.9, 1, 1, 0xa8dcff, 2.2);
  panel(2.5, 3, -4.9, 2, 1, 0xffe0b0, 1.6);
  panel(3, 1.5, 0, 1, -4.9, 0x3fe0ff, 1.4);
  return s;
}

/** Plataforma holográfica bajo los pies: anillos, disco de luz y haz vertical. */
function crearPlataforma_() {
  const T = THREE, PI = Math.PI;
  const g = new T.Group();
  const textura = (w, h, pintar) => {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    pintar(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c);
    t.encoding = T.sRGBEncoding;
    return t;
  };
  const luz = extra => {
    const m = new T.MeshBasicMaterial(Object.assign({ transparent: true, depthWrite: false, side: T.DoubleSide }, extra));
    if (extra.color !== undefined) m.color.convertSRGBToLinear();
    m.toneMapped = false;
    return m;
  };

  const anillo = new T.Mesh(new T.RingGeometry(0.95, 1.0, 80), luz({ color: 0x3fe0ff, opacity: 0.95 }));
  anillo.rotation.x = -PI / 2;
  g.add(anillo);
  const interior = new T.Mesh(new T.RingGeometry(0.62, 0.64, 64), luz({ color: 0xf4f7ff, opacity: 0.35 }));
  interior.rotation.x = -PI / 2;
  g.add(interior);
  for (let i = 0; i < 6; i++) {
    const arco = new T.Mesh(new T.RingGeometry(1.12, 1.17, 20, 1, i * PI / 3, PI / 5), luz({ color: i % 3 ? 0xf4f7ff : 0xffb92e, opacity: 0.75 }));
    arco.rotation.x = -PI / 2;
    g.add(arco);
  }
  const disco = new T.Mesh(new T.CircleGeometry(1.45, 48), luz({
    blending: T.AdditiveBlending,
    map: textura(128, 128, (x, w) => {
      const gr = x.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      gr.addColorStop(0, 'rgba(63,224,255,0.55)'); gr.addColorStop(0.6, 'rgba(63,224,255,0.12)'); gr.addColorStop(1, 'rgba(63,224,255,0)');
      x.fillStyle = gr; x.fillRect(0, 0, w, w);
    })
  }));
  disco.rotation.x = -PI / 2;
  disco.position.y = 0.003;
  g.add(disco);
  const haz = new T.Mesh(new T.CylinderGeometry(1.0, 1.0, 3.6, 48, 1, true), luz({
    blending: T.AdditiveBlending,
    map: textura(4, 128, (x, w, h) => {
      const gr = x.createLinearGradient(0, 0, 0, h);
      gr.addColorStop(0, 'rgba(63,224,255,0)'); gr.addColorStop(0.55, 'rgba(63,224,255,0.03)'); gr.addColorStop(1, 'rgba(63,224,255,0.16)');
      x.fillStyle = gr; x.fillRect(0, 0, w, h);
    })
  }));
  haz.position.y = 1.8;
  g.add(haz);
  return g;
}

function soportaWebGL_() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }
  catch (e) { return false; }
}

function liberar_(obj) {
  obj.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
      if (m.map && m.map.propia) m.map.dispose();
      m.dispose();
    });
  });
}

/* ------------------------------------------------------------------ */
/* Texturas de relieve procedurales (se generan una vez y se reutilizan) */
/* ------------------------------------------------------------------ */

const TEXTURAS_AVATAR = {};

function texturaRelieve_(tipo) {
  if (TEXTURAS_AVATAR[tipo]) return TEXTURAS_AVATAR[tipo];
  const N = 256;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const x = c.getContext('2d');
  const az = (a, b) => a + Math.random() * (b - a);
  x.fillStyle = '#808080';
  x.fillRect(0, 0, N, N);

  if (tipo === 'tela') {
    // trama del tejido + motas + dos costuras
    for (let i = 0; i < N; i += 4) {
      x.fillStyle = 'rgba(255,255,255,0.16)'; x.fillRect(i, 0, 2, N);
      x.fillStyle = 'rgba(0,0,0,0.12)'; x.fillRect(0, i + 1, N, 2);
    }
    for (let k = 0; k < 2500; k++) {
      const v = Math.random() < 0.5 ? 0 : 255;
      x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.07)';
      x.fillRect(az(0, N), az(0, N), 3, 3);
    }
    x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(0, N * 0.5); x.lineTo(N, N * 0.5); x.moveTo(N * 0.25, 0); x.lineTo(N * 0.25, N); x.stroke();
    x.strokeStyle = 'rgba(255,255,255,0.35)'; x.lineWidth = 1; x.setLineDash([4, 4]);
    x.beginPath(); x.moveTo(0, N * 0.5 + 5); x.lineTo(N, N * 0.5 + 5); x.moveTo(N * 0.25 + 5, 0); x.lineTo(N * 0.25 + 5, N); x.stroke();
  } else if (tipo === 'pelo') {
    for (let k = 0; k < 1100; k++) {
      const px = az(0, N), v = Math.random() < 0.5 ? 0 : 255;
      x.strokeStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + az(0.08, 0.25) + ')';
      x.lineWidth = az(0.6, 1.8);
      x.beginPath();
      x.moveTo(px, -4);
      x.bezierCurveTo(px + az(-6, 6), N * 0.33, px + az(-6, 6), N * 0.66, px + az(-4, 4), N + 4);
      x.stroke();
    }
  } else if (tipo === 'piel') {
    for (let k = 0; k < 4000; k++) {
      const v = Math.random() < 0.5 ? 0 : 255;
      x.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.05)';
      x.fillRect(az(0, N), az(0, N), 2, 2);
    }
  } else if (tipo === 'suela') {
    for (let i = 0; i < N; i += 16) { x.fillStyle = '#ffffff'; x.fillRect(0, i, N, 7); }
  }

  // Mapa de alturas → mapa de normales
  const fuerza = { tela: 2.2, pelo: 3, piel: 0.8, suela: 4 }[tipo] || 2;
  const datos = x.getImageData(0, 0, N, N).data;
  const salida = x.createImageData(N, N);
  const h = (i, j) => datos[((((j + N) % N) * N) + ((i + N) % N)) * 4] / 255;
  for (let j = 0; j < N; j++) {
    for (let i = 0; i < N; i++) {
      const dx = (h(i - 1, j) - h(i + 1, j)) * fuerza, dy = (h(i, j - 1) - h(i, j + 1)) * fuerza;
      const l = Math.sqrt(dx * dx + dy * dy + 1), p = (j * N + i) * 4;
      salida.data[p] = (dx / l * 0.5 + 0.5) * 255;
      salida.data[p + 1] = (dy / l * 0.5 + 0.5) * 255;
      salida.data[p + 2] = (1 / l * 0.5 + 0.5) * 255;
      salida.data[p + 3] = 255;
    }
  }
  x.putImageData(salida, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set({ tela: 5, pelo: 3, piel: 2, suela: 4 }[tipo] || 1, { tela: 5, pelo: 2, piel: 2, suela: 1 }[tipo] || 1);
  TEXTURAS_AVATAR[tipo] = t;
  return t;
}

/* ------------------------------------------------------------------ */
/* Modelo                                                              */
/* ------------------------------------------------------------------ */

function construirAstronauta_(c, galon, nombre, sombras) {
  const T = THREE, PI = Math.PI;
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const lin = hex => new T.Color(hex).convertSRGBToLinear();
  const g = new T.Group();

  /* --- Materiales --- */
  const tela = texturaRelieve_('tela');
  const std = (color, extra) => new T.MeshStandardMaterial(Object.assign({ color: lin(color), roughness: 0.7, metalness: 0 }, extra || {}));
  const traje = std(c.traje, { roughness: 0.82, normalMap: tela, normalScale: new T.Vector2(0.45, 0.45) });
  const colorDetalle = new T.Color(c.traje).multiplyScalar(0.72);
  const detalle = std('#' + colorDetalle.getHexString(), { roughness: 0.75, normalMap: tela, normalScale: new T.Vector2(0.6, 0.6) });
  const guante = std('#d5dbe2', { roughness: 0.78, normalMap: tela, normalScale: new T.Vector2(0.5, 0.5) });
  const metal = std('#b9c2cc', { metalness: 0.85, roughness: 0.28 });
  const metalOscuro = std('#5c6570', { metalness: 0.7, roughness: 0.4 });
  const goma = std('#2d3138', { roughness: 0.9, normalMap: texturaRelieve_('suela'), normalScale: new T.Vector2(1, 1) });
  const plastico = std('#8f99a6', { roughness: 0.45, metalness: 0.15 });
  const casco = new T.MeshPhysicalMaterial({ color: lin(c.casco), roughness: 0.32, metalness: 0.1, clearcoat: 0.8, clearcoatRoughness: 0.2, side: T.DoubleSide });
  const emisivo = (color, intensidad) => {
    const m = new T.MeshStandardMaterial({ color: lin(color), emissive: lin(color), emissiveIntensity: intensidad || 1.5 });
    m.toneMapped = false;
    return m;
  };

  const sombrear = m => { if (sombras) { m.castShadow = true; m.receiveShadow = true; } return m; };
  const pon = (geo, mat, x, y, z, padre) => {
    const m = new T.Mesh(geo, mat);
    m.position.set(x, y, z);
    (padre || g).add(sombrear(m));
    return m;
  };
  const alinear = (m, eje, dir) => { m.quaternion.setFromUnitVectors(eje, dir.clone().normalize()); return m; };

  /** Pieza alargada entre dos puntos con un ligero abombamiento (miembro del traje). */
  const miembro = (a, b, r1, r2, mat, bombeo) => {
    const L = a.distanceTo(b), pts = [new T.Vector2(0.001, 0)];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      pts.push(new T.Vector2((r1 + (r2 - r1) * t) * (1 + (bombeo || 0.06) * Math.sin(PI * t)), t * L));
    }
    pts.push(new T.Vector2(0.001, L));
    const m = pon(new T.LatheGeometry(pts, 32), mat, a.x, a.y, a.z);
    return alinear(m, V(0, 1, 0), b.clone().sub(a));
  };
  /** Anillos de fuelle alrededor de una articulación. */
  const fuelle = (centro, dir, r, n, sep) => {
    for (let k = 0; k < n; k++) {
      const p = centro.clone().add(dir.clone().normalize().multiplyScalar((k - (n - 1) / 2) * sep));
      alinear(pon(new T.TorusGeometry(r, r * 0.13, 10, 36), detalle, p.x, p.y, p.z), V(0, 0, 1), dir);
    }
  };
  const lathe = (perfil, mat, segs) => pon(new T.LatheGeometry(perfil.map(p => new T.Vector2(p[0], p[1])), segs || 48), mat, 0, 0, 0);
  const caja = (w, h, d, r, mat) => {
    const s = new T.Shape();
    s.moveTo(-w / 2 + r, -h / 2);
    s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
    s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
    s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
    s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
    const geo = new T.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 3, curveSegments: 6 });
    return new T.Mesh(geo, mat);
  };

  /* --- Tronco --- */
  const torso = lathe([[0.001, 1.36], [0.30, 1.37], [0.42, 1.44], [0.45, 1.55], [0.44, 1.66], [0.47, 1.80], [0.53, 1.98],
    [0.565, 2.15], [0.57, 2.28], [0.54, 2.38], [0.46, 2.46], [0.34, 2.52], [0.2, 2.55], [0.001, 2.56]], traje);
  torso.scale.z = 0.72;
  const cadera = lathe([[0.001, 1.16], [0.30, 1.17], [0.43, 1.25], [0.46, 1.36], [0.44, 1.47], [0.001, 1.49]], detalle);
  cadera.scale.z = 0.78;
  const cintura = pon(new T.TorusGeometry(0.455, 0.032, 12, 56), metal, 0, 1.53, 0);
  cintura.rotation.x = PI / 2;
  cintura.scale.y = 0.74;
  const cintura2 = pon(new T.TorusGeometry(0.46, 0.018, 8, 56), casco, 0, 1.57, 0);
  cintura2.rotation.x = PI / 2;
  cintura2.scale.y = 0.74;

  /* --- Piernas y botas --- */
  [-1, 1].forEach(s => {
    const cad = V(s * 0.23, 1.36, 0), rod = V(s * 0.25, 0.84, 0.03), tob = V(s * 0.26, 0.27, 0);
    pon(new T.SphereGeometry(0.2, 24, 16), traje, cad.x, cad.y, cad.z);
    miembro(cad, rod, 0.205, 0.175, traje);
    pon(new T.SphereGeometry(0.17, 24, 16), detalle, rod.x, rod.y, rod.z);
    fuelle(rod, tob.clone().sub(cad), 0.178, 3, 0.055);
    miembro(rod, tob, 0.172, 0.15, traje);
    // bota: perfil lateral extruido
    const perfil = new T.Shape();
    perfil.moveTo(-0.14, 0); perfil.lineTo(0.3, 0);
    perfil.quadraticCurveTo(0.37, 0, 0.36, 0.07); perfil.quadraticCurveTo(0.34, 0.15, 0.19, 0.17);
    perfil.lineTo(0.11, 0.31); perfil.lineTo(-0.13, 0.31); perfil.quadraticCurveTo(-0.17, 0.15, -0.14, 0);
    const gBota = new T.ExtrudeGeometry(perfil, { depth: 0.26, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03, bevelSegments: 3, curveSegments: 8 });
    gBota.rotateY(-PI / 2); gBota.translate(0.13, 0, 0);
    pon(gBota, guante, s * 0.26, 0.045, -0.02);
    const suela = new T.Shape();
    suela.moveTo(-0.17, 0); suela.lineTo(0.38, 0); suela.lineTo(0.38, 0.04); suela.lineTo(-0.17, 0.04); suela.lineTo(-0.17, 0);
    const gSuela = new T.ExtrudeGeometry(suela, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 2 });
    gSuela.rotateY(-PI / 2); gSuela.translate(0.15, 0, 0);
    pon(gSuela, goma, s * 0.26, 0.012, -0.02);
    const tobillo = pon(new T.TorusGeometry(0.155, 0.03, 10, 32), casco, tob.x, 0.36, tob.z);
    tobillo.rotation.x = PI / 2;
  });

  /* --- Brazos y guantes --- */
  [-1, 1].forEach(s => {
    const hom = V(s * 0.6, 2.28, 0), codo = V(s * 0.74, 1.8, 0.04), mun = V(s * 0.79, 1.36, 0.1);
    pon(new T.SphereGeometry(0.19, 24, 16), traje, hom.x, hom.y, hom.z);
    alinear(pon(new T.TorusGeometry(0.17, 0.03, 10, 40), metal, s * 0.66, 2.2, 0.01), V(0, 0, 1), codo.clone().sub(hom));
    miembro(hom, codo, 0.16, 0.138, traje);
    pon(new T.SphereGeometry(0.135, 20, 14), detalle, codo.x, codo.y, codo.z);
    fuelle(codo, mun.clone().sub(hom), 0.14, 3, 0.045);
    miembro(codo, mun, 0.135, 0.115, traje);
    const dir = mun.clone().sub(codo).normalize();
    alinear(pon(new T.TorusGeometry(0.118, 0.028, 10, 32), casco, mun.x, mun.y, mun.z), V(0, 0, 1), dir);

    // guante: el eje -Y local apunta a lo largo del antebrazo
    const mano = new T.Group();
    mano.position.copy(mun);
    alinear(mano, V(0, -1, 0), dir);
    g.add(mano);
    pon(new T.CylinderGeometry(0.11, 0.105, 0.09, 24), metalOscuro, 0, -0.03, 0, mano);
    // palma y dedos prismáticos (estilo bloque)
    pon(new T.BoxGeometry(0.1, 0.16, 0.17), guante, 0, -0.15, 0, mano);
    pon(new T.BoxGeometry(0.104, 0.03, 0.174), metalOscuro, 0, -0.085, 0, mano);
    [-0.0615, -0.0205, 0.0205, 0.0615].forEach((z, i) => {
      const largo = [0.08, 0.095, 0.09, 0.07][i];
      const dedo = new T.Group();
      dedo.position.set(-s * 0.005, -0.23, z);
      dedo.rotation.z = s * 0.22;
      mano.add(dedo);
      pon(new T.BoxGeometry(0.06, largo, 0.038), guante, 0, -largo / 2, 0, dedo);
    });
    const pulgar = new T.Group();
    pulgar.position.set(-s * 0.04, -0.13, 0.085);
    pulgar.rotation.set(-0.55, 0, s * 0.45);
    mano.add(pulgar);
    pon(new T.BoxGeometry(0.05, 0.085, 0.045), guante, 0, -0.042, 0, pulgar);
  });

  /* --- Mochila de soporte vital (PLSS) --- */
  const mochila = caja(0.86, 1.05, 0.32, 0.08, traje);
  mochila.position.set(0, 1.97, -0.76);
  g.add(sombrear(mochila));
  const tapa = caja(0.7, 0.16, 0.05, 0.03, plastico);
  tapa.position.set(0, 2.515, -0.6);
  tapa.rotation.x = -PI / 2;
  g.add(sombrear(tapa));
  for (let i = 0; i < 6; i++) pon(new T.BoxGeometry(0.5, 0.018, 0.02), metalOscuro, 0, 1.62 + i * 0.045, -0.79);
  [-1, 1].forEach(s => {
    const tanque = pon(new T.CylinderGeometry(0.07, 0.07, 0.5, 20), metal, s * 0.35, 1.72, -0.84);
    pon(new T.SphereGeometry(0.07, 16, 10), metal, s * 0.35, 1.97, -0.84);
    tanque.castShadow = sombras;
  });
  pon(new T.CylinderGeometry(0.008, 0.008, 0.3, 6), metalOscuro, 0.3, 2.62, -0.62);
  pon(new T.SphereGeometry(0.018, 10, 8), emisivo('#ff4d4d', 2), 0.3, 2.78, -0.62);

  /* --- Módulo de pecho (DCM) y mangueras --- */
  const dcm = caja(0.4, 0.24, 0.12, 0.03, plastico);
  dcm.position.set(0, 1.95, 0.37);
  g.add(sombrear(dcm));
  pon(new T.PlaneGeometry(0.16, 0.07), emisivo('#3fe0ff', 1.2), -0.06, 1.98, 0.517);
  ['#ff4d4d', '#ffd23f', '#3ddc84'].forEach((col, i) => pon(new T.SphereGeometry(0.014, 10, 8), emisivo(col, 2), 0.06 + i * 0.04, 1.98, 0.515));
  [-0.12, 0, 0.12].forEach(x => pon(new T.CylinderGeometry(0.022, 0.022, 0.04, 16), metalOscuro, x, 2.1, 0.44));
  pon(new T.CylinderGeometry(0.03, 0.03, 0.03, 16), metal, 0.12, 1.88, 0.53).rotation.x = PI / 2;
  [-1, 1].forEach(s => {
    const curva = new T.CatmullRomCurve3([V(s * 0.2, 1.93, 0.44), V(s * 0.36, 1.8, 0.38), V(s * 0.5, 1.74, 0.12), V(s * 0.47, 1.86, -0.3), V(s * 0.4, 1.95, -0.44)]);
    pon(new T.TubeGeometry(curva, 40, 0.022, 10, false), guante, 0, 0, 0);
    pon(new T.CylinderGeometry(0.035, 0.035, 0.05, 16), emisivo(s < 0 ? '#3a7bff' : '#ff4040', 0.4), s * 0.2, 1.93, 0.45).rotation.z = PI / 2;
  });

  /* --- Placa con el nombre y emblema de la misión --- */
  const lienzo = (w, h) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h; return cv; };
  const texLienzo = cv => { const t = new T.CanvasTexture(cv); t.encoding = T.sRGBEncoding; t.anisotropy = 4; t.propia = true; return t; };
  const cvNombre = lienzo(512, 128), texNombre = texLienzo(cvNombre);
  const pintarNombre = n => {
    const x = cvNombre.getContext('2d');
    x.fillStyle = '#1b2232'; x.fillRect(0, 0, 512, 128);
    x.strokeStyle = '#c9d2de'; x.lineWidth = 6; x.strokeRect(6, 6, 500, 116);
    x.fillStyle = '#ffffff';
    x.font = '700 62px "Chakra Petch", "Inter", sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle';
    const texto = (n || 'Tripulante').toUpperCase();
    x.fillText(texto, 256, 68, 470);
    texNombre.needsUpdate = true;
  };
  pintarNombre(nombre);
  g.userData.ponerNombre = pintarNombre;
  const placa = pon(new T.PlaneGeometry(0.24, 0.06), new T.MeshStandardMaterial({ map: texNombre, roughness: 0.6 }), -0.25, 2.2, 0.377);
  placa.rotation.y = -0.34;

  const cvEmblema = lienzo(256, 256), xe = cvEmblema.getContext('2d');
  xe.fillStyle = '#0d1630'; xe.beginPath(); xe.arc(128, 128, 124, 0, PI * 2); xe.fill();
  xe.strokeStyle = '#ffb92e'; xe.lineWidth = 10; xe.stroke();
  xe.strokeStyle = '#3fe0ff'; xe.lineWidth = 6; xe.beginPath(); xe.ellipse(128, 128, 92, 38, -0.4, 0, PI * 2); xe.stroke();
  xe.fillStyle = '#2f6fed'; xe.beginPath(); xe.arc(128, 128, 34, 0, PI * 2); xe.fill();
  xe.fillStyle = '#ffffff'; xe.beginPath(); xe.arc(206, 92, 10, 0, PI * 2); xe.fill();
  const emblema = pon(new T.CircleGeometry(0.065, 32), new T.MeshStandardMaterial({ map: texLienzo(cvEmblema), roughness: 0.6 }), 0.25, 2.2, 0.377);
  emblema.rotation.y = 0.34;

  /* --- Galón de rango en los dos hombros --- */
  if (galon !== null && galon !== undefined) {
    const cvG = document.createElement('canvas'); cvG.width = 160; cvG.height = 192;
    dibujarGalon(cvG.getContext('2d'), galon, 160, 192);
    const texG = texLienzo(cvG);
    // el brillo sigue al dibujo del galón (emissiveMap), no a toda la placa
    const matG = new T.MeshStandardMaterial({ map: texG, transparent: true, roughness: 0.55, metalness: 0.2,
      emissive: lin('#ffffff'), emissiveMap: texG, emissiveIntensity: galon >= 7 ? 0.55 : 0.25 });
    [-1, 1].forEach(s => {
      // en la cara delantera-exterior del hombro, para que se vea de frente y de lado
      const n = V(s * 0.8, 0, 0.6).normalize(), p = V(s * 0.8, 2.03, 0.1).add(n.clone().multiplyScalar(0.03));
      const placa = pon(new T.PlaneGeometry(0.19, 0.23), matG, p.x, p.y, p.z);
      alinear(placa, V(0, 0, 1), n);
    });
  }

  /* --- Cabeza --- */
  const cabeza = new T.Group();
  cabeza.position.set(0, 2.85, 0.03);
  g.add(cabeza);
  construirCabeza_(cabeza, c, pon, lin);

  /* --- Casco --- */
  const yelmo = new T.Group();
  yelmo.position.set(0, 2.86, 0.02);
  g.add(yelmo);
  const vidrio = new T.Mesh(
    new T.SphereGeometry(0.4, 56, 40, 0, PI * 2, 0, PI * 0.78),
    new T.MeshPhysicalMaterial({ color: lin('#e6f6ff'), transparent: true, opacity: 0.12, roughness: 0.03, metalness: 0,
      clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 2.4, depthWrite: false, side: T.DoubleSide })
  );
  vidrio.renderOrder = 5;
  yelmo.add(vidrio);
  pon(new T.SphereGeometry(0.415, 48, 28, PI * 7 / 6, PI * 2 / 3, 0, PI * 0.72), casco, 0, 0, 0, yelmo);   // carcasa trasera
  const banda = pon(new T.TorusGeometry(0.415, 0.022, 10, 56, PI * 0.58), casco, 0, 0, 0, yelmo);       // banda superior (nuca → coronilla)
  banda.rotation.y = PI / 2;
  const oro = new T.MeshStandardMaterial({ color: lin('#e3a94c'), metalness: 1, roughness: 0.12, envMapIntensity: 1.6, side: T.DoubleSide });
  pon(new T.SphereGeometry(0.425, 48, 16, PI / 2 - 0.9, 1.8, PI * 0.1, PI * 0.22), oro, 0, 0, 0, yelmo);    // visera solar subida
  [-1, 1].forEach(s => {
    pon(new T.BoxGeometry(0.07, 0.07, 0.15), casco, s * 0.41, 0.06, 0.05, yelmo);
    pon(new T.CircleGeometry(0.018, 16), emisivo('#fff1c4', 1.6), s * 0.41, 0.06, 0.128, yelmo);
  });
  const cuello = pon(new T.TorusGeometry(0.27, 0.05, 16, 56), casco, 0, -0.31, 0, yelmo);
  cuello.rotation.x = PI / 2;
  const cuello2 = pon(new T.TorusGeometry(0.3, 0.02, 10, 56), metal, 0, -0.27, 0, yelmo);
  cuello2.rotation.x = PI / 2;

  return g;
}

/* ------------------------------------------------------------------ */
/* Manos que sujetan la tablet del panel de misiones                   */
/* ------------------------------------------------------------------ */

/**
 * Dibuja dos guantes (como los del astronauta) agarrando los bordes de la tablet.
 * Usa dos capas: `atras` (palma, dedos y manga, por detrás de la tablet) y
 * `delante` (pulgares, por encima del marco). Cámara ortográfica en píxeles.
 * `medir()` devuelve el rectángulo de la tablet dentro del contenedor.
 */
function crearManosTablet(atras, delante, colores, medir) {
  if (!window.THREE || !soportaWebGL_()) return { destruir() {} };
  const T = THREE;

  const capa = (cont, parte) => {
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = T.sRGBEncoding;
    renderer.toneMapping = T.ACESFilmicToneMapping;
    cont.appendChild(renderer.domElement);
    const escena = new T.Scene();
    const pmrem = new T.PMREMGenerator(renderer);
    const estudio = escenaEstudio_();
    const entorno = pmrem.fromScene(estudio, 0.04).texture;
    liberar_(estudio);
    escena.environment = entorno;
    escena.add(new T.HemisphereLight(0xdfe8ff, 0x1c2238, 0.45));
    const clave = new T.DirectionalLight(0xfff4e6, 1.3);
    clave.position.set(-0.4, 0.8, 1);
    escena.add(clave);
    const cian = new T.DirectionalLight(0x5fd8ff, 0.7);
    cian.position.set(0.6, -0.2, -0.5);
    escena.add(cian);
    const camara = new T.OrthographicCamera(0, 1, 0, -1, -4000, 4000);
    const manos = [-1, 1].map(lado => {
      const m = manoTablet_(parte, colores);
      if (lado > 0) m.scale.x = -1;   // la derecha es la izquierda reflejada
      const pivote = new T.Group();
      pivote.add(m);
      escena.add(pivote);
      return pivote;
    });
    return { renderer, escena, camara, entorno, pmrem, cont, manos };
  };
  const capas = [capa(atras, 'atras'), capa(delante, 'delante')];

  function colocar() {
    const r = medir();
    capas.forEach(c => {
      const W = c.cont.clientWidth, H = c.cont.clientHeight;
      if (!W || !H) return;
      c.renderer.setSize(W, H);
      Object.assign(c.camara, { left: 0, right: W, top: 0, bottom: -H });
      c.camara.updateProjectionMatrix();
      const k = Math.min(r.h * 0.78, 560);     // píxeles por unidad del modelo
      const y = -(r.y + r.h * 0.58);
      c.manos[0].position.set(r.x + 6, y, 0);
      c.manos[1].position.set(r.x + r.w - 6, y, 0);
      c.manos.forEach(m => m.scale.setScalar(k));
      c.renderer.render(c.escena, c.camara);
    });
  }
  const ro = new ResizeObserver(colocar);
  ro.observe(atras.parentNode);
  colocar();
  // las fuentes y el diseño pueden asentarse un poco después
  const repintar = setTimeout(colocar, 300);

  return {
    destruir() {
      ro.disconnect();
      clearTimeout(repintar);
      capas.forEach(c => {
        liberar_(c.escena);
        c.entorno.dispose(); c.pmrem.dispose(); c.renderer.dispose();
        if (c.renderer.domElement.parentNode) c.renderer.domElement.parentNode.removeChild(c.renderer.domElement);
      });
    }
  };
}

/**
 * Mano izquierda agarrando el borde izquierdo de la tablet.
 * Origen: punto de agarre en el borde; x hacia dentro de la tablet, z hacia el espectador.
 */
function manoTablet_(parte, colores) {
  const T = THREE, PI = Math.PI;
  const V = (x, y, z) => new T.Vector3(x, y, z);
  const lin = hex => new T.Color(hex).convertSRGBToLinear();
  const tela = texturaRelieve_('tela');
  const std = (color, extra) => new T.MeshStandardMaterial(Object.assign({ color: lin(color), roughness: 0.75 }, extra || {}));
  const guante = std('#d5dbe2', { roughness: 0.78, normalMap: tela, normalScale: new T.Vector2(0.5, 0.5) });
  const metalOscuro = std('#5c6570', { metalness: 0.7, roughness: 0.4 });
  const metal = std('#b9c2cc', { metalness: 0.85, roughness: 0.28 });
  const traje = std(colores.traje || '#f1f3f5', { roughness: 0.82, normalMap: tela, normalScale: new T.Vector2(0.45, 0.45) });
  const detalle = std('#' + new T.Color(colores.traje || '#f1f3f5').multiplyScalar(0.72).getHexString(), { normalMap: tela });
  const casco = new T.MeshPhysicalMaterial({ color: lin(colores.casco || '#ff7a1a'), roughness: 0.32, metalness: 0.1, clearcoat: 0.8 });

  const g = new T.Group();
  const mano = new T.Group();
  mano.rotation.set(0.08, 0.22, 0.04);   // un poco girada para que se vea el volumen
  g.add(mano);
  const pon = (geo, mat, x, y, z, padre) => { const m = new T.Mesh(geo, mat); m.position.set(x, y, z); (padre || mano).add(m); return m; };

  if (parte === 'delante') {
    // pulgar sobre el marco, apuntando hacia arriba y hacia dentro
    const base = pon(new T.BoxGeometry(0.075, 0.075, 0.05), guante, -0.04, -0.02, 0.05);
    base.rotation.z = -0.3;
    const pulgar = new T.Group();
    pulgar.position.set(-0.012, 0.0, 0.055);
    pulgar.rotation.z = -0.75;
    mano.add(pulgar);
    pon(new T.BoxGeometry(0.052, 0.12, 0.046), guante, 0, 0.055, 0, pulgar);
    pon(new T.BoxGeometry(0.054, 0.012, 0.048), metalOscuro, 0, 0.09, 0, pulgar);
    return g;
  }

  // palma contra el canto y dedos por detrás
  pon(new T.BoxGeometry(0.1, 0.18, 0.17), guante, -0.058, 0, -0.025);
  pon(new T.BoxGeometry(0.104, 0.03, 0.174), metalOscuro, -0.058, -0.075, -0.025);
  [0.065, 0.022, -0.022, -0.065].forEach((y, i) => {
    const dedo = pon(new T.BoxGeometry(0.13 - i * 0.008, 0.038, 0.05), guante, 0.045, y, -0.075);
    dedo.rotation.y = -0.15;
  });

  // muñeca, puño y manga del traje hacia abajo y hacia fuera
  const dir = V(-0.42, -1, 0.12).normalize();
  const mun = V(-0.07, -0.12, -0.025);
  const alinear = (m, eje) => { m.quaternion.setFromUnitVectors(eje, dir); return m; };
  alinear(pon(new T.CylinderGeometry(0.075, 0.072, 0.07, 28), metalOscuro, mun.x, mun.y, mun.z), V(0, 1, 0));
  const anillo = mun.clone().add(dir.clone().multiplyScalar(0.05));
  alinear(pon(new T.TorusGeometry(0.08, 0.018, 10, 32), casco, anillo.x, anillo.y, anillo.z), V(0, 0, 1));
  const L = 1.4, pts = [new T.Vector2(0.001, 0)];
  for (let i = 0; i <= 10; i++) { const t = i / 10; pts.push(new T.Vector2(0.082 + 0.03 * t, t * L)); }
  pts.push(new T.Vector2(0.001, L));
  const inicio = mun.clone().add(dir.clone().multiplyScalar(0.06));
  alinear(pon(new T.LatheGeometry(pts, 32), traje, inicio.x, inicio.y, inicio.z), V(0, 1, 0));
  [0.22, 0.27, 0.32].forEach(d => {
    const p = inicio.clone().add(dir.clone().multiplyScalar(d));
    alinear(pon(new T.TorusGeometry(0.09 + d * 0.02, 0.012, 8, 32), detalle, p.x, p.y, p.z), V(0, 0, 1));
  });
  const aro = inicio.clone().add(dir.clone().multiplyScalar(0.5));
  alinear(pon(new T.TorusGeometry(0.1, 0.02, 10, 32), metal, aro.x, aro.y, aro.z), V(0, 0, 1));
  return g;
}

/* ------------------------------------------------------------------ */
/* Cabeza, cara y pelo (estilo bloque, tipo muñeco de construcción)     */
/* ------------------------------------------------------------------ */

// Semiejes de la cabeza: la cara está en el plano z = CABEZA.z
const CABEZA = { x: 0.18, y: 0.18, z: 0.17 };

/** Prisma con aristas ligeramente redondeadas, centrado en el origen. */
function cajaRedondeada_(w, h, d, r) {
  const T = THREE;
  const s = new T.Shape(), a = w / 2 - r, b = h / 2 - r;
  s.moveTo(-a, -b); s.lineTo(a, -b); s.lineTo(a, b); s.lineTo(-a, b); s.lineTo(-a, -b);
  const geo = new T.ExtrudeGeometry(s, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 3, curveSegments: 1 });
  geo.center();
  return geo;
}

function construirCabeza_(cab, c, pon, lin) {
  const T = THREE;
  const H = CABEZA, zc = H.z;
  const tono = new T.Color(c.piel);
  const piel = new T.MeshStandardMaterial({ color: lin(c.piel), emissive: lin(c.piel), emissiveIntensity: 0.04, roughness: 0.55, envMapIntensity: 0.6,
    normalMap: texturaRelieve_('piel'), normalScale: new T.Vector2(0.25, 0.25) });
  const labio = new T.MeshStandardMaterial({ color: lin('#' + tono.clone().lerp(new T.Color('#a8444c'), 0.45).multiplyScalar(0.9).getHexString()), roughness: 0.45 });
  const oscuro = new T.MeshStandardMaterial({ color: lin('#2a1214'), roughness: 0.6 });
  const pelo = new T.MeshStandardMaterial({ color: lin(c.colorPelo), roughness: 0.55, normalMap: texturaRelieve_('pelo'), normalScale: new T.Vector2(0.6, 0.6) });
  const blanco = new T.MeshPhysicalMaterial({ color: lin('#f6f3ef'), roughness: 0.2, clearcoat: 1 });
  const iris = new T.MeshStandardMaterial({ color: lin('#5b3a22'), roughness: 0.3 });
  const negro = new T.MeshStandardMaterial({ color: lin('#0b0b0d'), roughness: 0.25 });
  const brillo = new T.MeshBasicMaterial({ color: 0xffffff });
  /** Bloque pegado a la cara: (x, y) en el plano frontal, sobresale `fondo`. */
  const frente = (w, h, fondo, mat, x, y, extra) => pon(new T.BoxGeometry(w, h, fondo), mat, x, y, zc + (extra || 0) + fondo / 2, cab);

  // cabeza, cuello y orejas
  pon(cajaRedondeada_(H.x * 2, H.y * 2, H.z * 2, 0.022), piel, 0, 0, 0, cab);
  pon(new T.BoxGeometry(0.15, 0.16, 0.14), piel, 0, -0.24, -0.01, cab);
  [-1, 1].forEach(s => pon(new T.BoxGeometry(0.03, 0.075, 0.06), piel, s * (H.x + 0.012), -0.005, -0.01, cab));

  // ojos
  const ojo = (s, modo) => {
    const x = s * 0.075, y = 0.03;
    if (modo === 'cerrado') {
      // guiño: dos trazos formando un arco
      [-1, 1].forEach(k => frente(0.04, 0.012, 0.006, negro, x + k * 0.017, y - 0.004 + (k === -s ? 0 : 0), 0).rotation.z = k * 0.35);
      return;
    }
    const alto = modo === 'abierto' ? 0.075 : 0.058;
    frente(0.068, alto, 0.008, blanco, x, y);
    frente(0.034, Math.min(0.044, alto - 0.012), 0.004, iris, x - s * 0.004, y - 0.004, 0.008);
    frente(0.017, 0.022, 0.003, negro, x - s * 0.004, y - 0.004, 0.012);
    frente(0.008, 0.008, 0.002, brillo, x - s * 0.004 + 0.008, y + 0.006, 0.015);
  };
  const ceja = (s, alto, giro) => {
    frente(0.075, 0.017, 0.01, pelo, s * 0.075, 0.095 + (alto || 0), 0).rotation.z = s * (giro || 0);
  };
  const mejillas = () => [-1, 1].forEach(s => {
    frente(0.04, 0.024, 0.002, new T.MeshStandardMaterial({ color: lin('#ff7f7f'), transparent: true, opacity: 0.35, roughness: 0.8 }), s * 0.115, -0.045);
  });

  // nariz: pequeño prisma
  frente(0.038, 0.058, 0.026, piel, 0, -0.03);

  const cara = c.cara;
  if (cara === 'seria') {
    ojo(-1); ojo(1); ceja(-1, -0.006, 0.22); ceja(1, -0.006, 0.22);
    frente(0.085, 0.015, 0.008, labio, 0, -0.1);
  } else if (cara === 'guino') {
    ojo(-1, 'cerrado'); ojo(1); ceja(-1, -0.005, 0); ceja(1, 0.008, -0.08); mejillas();
    frente(0.07, 0.016, 0.008, labio, 0.004, -0.104);
    frente(0.018, 0.016, 0.008, labio, 0.047, -0.09);
    frente(0.018, 0.016, 0.008, labio, -0.04, -0.1);
  } else if (cara === 'sorpresa') {
    ojo(-1, 'abierto'); ojo(1, 'abierto'); ceja(-1, 0.018, -0.12); ceja(1, 0.018, -0.12);
    frente(0.054, 0.06, 0.008, labio, 0, -0.105);
    frente(0.034, 0.04, 0.004, oscuro, 0, -0.105, 0.008);
  } else {
    ojo(-1); ojo(1); ceja(-1, 0, -0.05); ceja(1, 0, -0.05);
    if (cara !== 'gafas') mejillas();
    // sonrisa «pixelada»: barra inferior y comisuras levantadas
    frente(0.07, 0.016, 0.008, labio, 0, -0.106);
    [-1, 1].forEach(s => frente(0.018, 0.016, 0.008, labio, s * 0.044, -0.092));
  }
  if (cara === 'gafas') {
    const montura = new T.MeshStandardMaterial({ color: lin('#1d2230'), metalness: 0.6, roughness: 0.3 });
    const lente = new T.MeshPhysicalMaterial({ color: lin('#cfe6ff'), transparent: true, opacity: 0.18, roughness: 0.05, clearcoat: 1, depthWrite: false });
    const g = 0.009, w = 0.096, h = 0.078, zf = 0.022;
    [-1, 1].forEach(s => {
      const x = s * 0.075, y = 0.03;
      frente(w, g, g, montura, x, y + h / 2, zf); frente(w, g, g, montura, x, y - h / 2, zf);
      frente(g, h, g, montura, x - w / 2, y, zf); frente(g, h, g, montura, x + w / 2, y, zf);
      pon(new T.PlaneGeometry(w - g, h - g), lente, x, y, zc + zf + 0.002, cab);
      pon(new T.BoxGeometry(g, g, 0.2), montura, s * (H.x + 0.006), y + h / 2 - g, zc + zf - 0.1, cab);
    });
    frente(0.03, g, g, montura, 0, 0.03 + h / 2 - g, zf);
  }

  construirPelo_(cab, c.pelo, pelo, pon);
}

/** Peinados hechos de bloques: casquete (arriba, nuca y laterales) + piezas propias de cada estilo. */
function construirPelo_(cab, tipo, mat, pon) {
  const T = THREE, H = CABEZA;
  const bloque = (w, h, d, x, y, z, r) => pon(r ? cajaRedondeada_(w, h, d, r) : new T.BoxGeometry(w, h, d), mat, x, y, z, cab);
  const top = H.y, atras = -H.z, lado = H.x;

  if (tipo === 'rapado') {
    // pelo al ras: capa fina
    mat.roughness = 0.9;
    mat.normalScale.set(0.25, 0.25);
    bloque(lado * 2 + 0.012, 0.016, H.z * 2 + 0.006, 0, top + 0.004, -0.003);
    bloque(lado * 2 + 0.012, 0.2, 0.014, 0, top - 0.09, atras - 0.004);
    [-1, 1].forEach(s => bloque(0.014, 0.1, H.z * 1.6, s * (lado + 0.004), top - 0.05, -0.03));
    return;
  }

  // casquete común
  const grosor = 0.035;
  bloque(lado * 2 + 0.03, grosor + 0.02, H.z * 2 + 0.03, 0, top + 0.012, -0.002, 0.008);
  bloque(lado * 2 + 0.03, 0.24, grosor, 0, top - 0.1, atras - grosor / 2 + 0.008, 0.006);
  [-1, 1].forEach(s => bloque(grosor, 0.15, H.z * 1.75, s * (lado + grosor / 2 - 0.006), top - 0.07, -0.025, 0.006));

  // flequillo escalonado sobre la frente
  const flequillo = alturas => {
    const n = alturas.length, w = (lado * 2 + 0.03) / n;
    alturas.forEach((h, i) => bloque(w + 0.002, h, 0.03, -lado - 0.015 + w * (i + 0.5), top + 0.01 - h / 2, H.z + 0.012, 0.004));
  };

  if (tipo === 'corto') {
    flequillo([0.07, 0.09, 0.06, 0.075, 0.05, 0.065]);
  } else if (tipo === 'largo') {
    flequillo([0.06, 0.05, 0.07, 0.07, 0.05, 0.06]);
    bloque(lado * 2 + 0.04, 0.48, 0.05, 0, top - 0.25, atras - 0.012, 0.008);
    [-1, 1].forEach(s => bloque(0.045, 0.42, 0.13, s * (lado + 0.024), top - 0.22, H.z - 0.07, 0.008));
  } else if (tipo === 'coleta') {
    flequillo([0.05, 0.065, 0.075, 0.06, 0.05, 0.045]);
    pon(new T.BoxGeometry(0.075, 0.04, 0.03), new T.MeshStandardMaterial({ color: 0x20242c, roughness: 0.6 }), 0, 0.07, atras - 0.05, cab);
    [[0.0, 0.01, 0.085], [0.0, -0.065, 0.075], [0.0, -0.135, 0.062], [0.0, -0.195, 0.05]].forEach((p, i) =>
      bloque(p[2], p[2] * 1.05, p[2], p[0], p[1] + 0.03, atras - 0.065 - i * 0.012, 0.006));
  } else if (tipo === 'mono') {
    flequillo([0.04, 0.05, 0.06, 0.06, 0.05, 0.04]);
    bloque(0.13, 0.11, 0.13, 0, top + 0.09, -0.06, 0.01);
    pon(new T.BoxGeometry(0.1, 0.022, 0.1), new T.MeshStandardMaterial({ color: 0x20242c, roughness: 0.6 }), 0, top + 0.035, -0.06, cab);
  } else if (tipo === 'rizado') {
    // afro de cubos con alturas irregulares (pseudoaleatorio fijo para que no cambie al girar)
    let semilla = 7;
    const az = () => { semilla = (semilla * 9301 + 49297) % 233280; return semilla / 233280; };
    const t = 0.065;
    for (let x = -lado - 0.01; x <= lado + 0.02; x += t) {
      for (let z = atras - 0.01; z <= H.z + 0.02; z += t) {
        bloque(t, t + az() * 0.035, t, x + t / 2 - 0.01, top + 0.03 + az() * 0.02, z + t / 2 - 0.02, 0.008);
      }
    }
    [0.1, 0.03, -0.04].forEach(y => {
      for (let x = -lado - 0.01; x <= lado + 0.02; x += t) bloque(t, t, t + az() * 0.02, x + t / 2 - 0.01, y, atras - t / 2 + 0.01, 0.008);
      for (let z = atras; z <= 0.05; z += t) [-1, 1].forEach(s => bloque(t + az() * 0.02, t, t, s * (lado + t / 2 - 0.01), y + 0.04, z + t / 2, 0.008));
    });
  }
}
