<style>
  :root {
    --fondo: #060a18;
    --panel: rgba(16, 24, 50, 0.86);
    --panel-2: rgba(28, 40, 78, 0.7);
    --borde: rgba(130, 160, 255, 0.18);
    --borde-fuerte: rgba(130, 160, 255, 0.4);
    --texto: #e9edff;
    --suave: #9ca8d4;
    --acento: #ffb703;
    --acento-2: #4cc9f0;
    --ok: #4ade80;
    --mal: #f87171;
    --radio: 14px;
    --sombra: 0 10px 40px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font: 15px/1.55 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .titulo { font-family: 'Space Grotesk', 'Inter', sans-serif; letter-spacing: -0.01em; }
  button { font: inherit; }

  /* Cielo estrellado */
  .cielo {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 12%, #fff9 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 38% 64%, #fffa 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 78%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 88%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 34%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 44%, #fff6 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 52%, #fff7 50%, transparent 51%),
      radial-gradient(ellipse 80% 60% at 85% -10%, rgba(76, 201, 240, 0.12), transparent 60%),
      radial-gradient(ellipse 70% 60% at -10% 110%, rgba(181, 23, 158, 0.12), transparent 60%),
      var(--fondo);
    background-size: 340px 340px, 420px 420px, 520px 520px, 380px 380px, 460px 460px, 600px 600px, 300px 300px, 500px 500px, 100% 100%, 100% 100%, 100% 100%;
  }

  /* Barra superior (HUD) */
  .barra {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 10px 24px;
    background: linear-gradient(180deg, rgba(5, 8, 17, 0.95), rgba(5, 8, 17, 0.82));
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--hud-linea);
  }
  .barra::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--hud-cian) 20%, transparent 45%, transparent 70%, var(--hud-ambar) 90%, transparent);
    opacity: 0.6;
  }
  .barra[hidden] { display: none; }
  .barra-avatar {
    flex: none; width: 56px; height: 62px; padding: 2px;
    background: linear-gradient(160deg, var(--hud-cian), rgba(63, 224, 255, 0.15));
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .avatar-mini {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #1b2f66, #070c1d);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }
  .avatar-mini canvas { display: block; }
  .barra-avatar { cursor: zoom-in; outline: none; }
  .barra-avatar:focus-visible { filter: drop-shadow(0 0 6px var(--hud-ambar)); }
  /* popup con el astronauta de cuerpo entero */
  .pop-avatar { position: fixed; z-index: 70; width: 250px; padding: 0 0 12px; pointer-events: none;
    background: linear-gradient(170deg, rgba(16, 27, 54, 0.97), rgba(5, 8, 17, 0.97)); border: 1px solid var(--hud-linea-fuerte);
    border-top: 2px solid var(--hud-cian); box-shadow: 0 0 22px rgba(63, 224, 255, 0.18), 0 12px 30px rgba(0, 0, 0, 0.55);
    clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
    opacity: 0; transform: translateX(-8px) scale(0.98); transform-origin: left top; transition: opacity .16s, transform .16s; visibility: hidden; }
  .pop-avatar.visible { opacity: 1; transform: none; visibility: visible; }
  .pop-escena { position: relative; height: 300px; background: radial-gradient(circle at 50% 38%, #1b2f66, #070c1d 75%); }
  .pop-info { padding: 10px 14px 0; text-align: center; }
  .pop-nombre { font: 700 16px 'Chakra Petch', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--hud-blanco); }
  .pop-rango { display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 3px;
    font: 600 12px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--hud-ambar); }
  .pop-estrellas { margin-top: 4px; font: 13px 'Share Tech Mono', monospace; color: rgba(220, 232, 255, 0.6); }
  .pop-estrellas b { color: var(--hud-ambar); font-weight: 400; }
  .barra-id { min-width: 0; }
  .barra-etq { font: 500 10.5px 'Chakra Petch', sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hud-cian); }
  .barra-nombre { font: 700 18px/1.15 'Chakra Petch', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra-rango { display: flex; align-items: center; gap: 6px; font: 600 11.5px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; color: var(--hud-ambar); }
  .barra-rango[data-ayuda] { text-decoration: none; cursor: help; }
  .galon-barra { flex: none; filter: drop-shadow(0 0 3px rgba(255, 185, 46, 0.35)); }
  .barra-progreso { flex: 1; max-width: 600px; margin-left: auto; }
  .barra-progreso-txt { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .barra-progreso-txt > span:last-child { font: 15px 'Share Tech Mono', monospace; color: rgba(230, 240, 255, 0.75); }
  .barra-progreso-txt b { color: var(--hud-ambar); font-weight: 400; font-size: 18px; }
  .barra-segmentos { display: flex; align-items: center; gap: 0; padding: 0 4px; }
  .seg-grupo { display: flex; gap: 3px; min-width: 0; }
  .seg-sep { flex: none; width: 2px; height: 18px; margin: 0 8px; background: var(--hud-ambar); box-shadow: 0 0 6px rgba(255, 185, 46, 0.6); transform: skewX(-24deg); }
  .seg-grupo.extra .seg { height: 9px; border-color: rgba(200, 230, 255, 0.16); }
  .seg-grupo.extra .seg.lleno { background: var(--hud-cian); border-color: var(--hud-cian); box-shadow: 0 0 8px rgba(63, 224, 255, 0.55); }
  .barra-grupos { display: flex; align-items: center; padding: 0 4px; margin-top: 2px; line-height: 1;
    font: 600 9.5px 'Chakra Petch', sans-serif; letter-spacing: 0.18em; text-transform: uppercase; }
  .barra-grupos .seg-sep { height: 0; box-shadow: none; background: none; }
  .barra-grupos .oblig { color: var(--hud-ambar); }
  .barra-grupos .extra { color: rgba(63, 224, 255, 0.65); }
  .seg {
    flex: 1; height: 12px; transform: skewX(-24deg);
    background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(200, 230, 255, 0.25);
  }
  .seg.lleno { background: var(--hud-ambar); border-color: var(--hud-ambar); box-shadow: 0 0 8px rgba(255, 185, 46, 0.55); }
  .seg.nuevo { animation: segNuevo 1s ease-out; }
  @keyframes segNuevo { 0% { background: #fff; box-shadow: 0 0 18px #fff; } 100% { } }
  /* objetivo cumplido: las obligatorias pasan a verde */
  .barra-objetivo .seg-grupo.oblig .seg.lleno { background: #7ee2a8; border-color: #7ee2a8; box-shadow: 0 0 8px rgba(126, 226, 168, 0.6); }
  .btn-peq-hud { padding: 10px 14px; font-size: 12px; }

  /* Botones */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px 20px; border-radius: 10px; border: 1px solid transparent;
    background: var(--acento); color: #1a1200; font-weight: 700; cursor: pointer;
    transition: transform .12s, filter .12s, opacity .12s;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-sec { background: transparent; color: var(--texto); border-color: var(--borde-fuerte); }
  .btn-peq { padding: 7px 12px; font-size: 13px; }
  .btn-grande { padding: 14px 26px; font-size: 16px; }

  .app { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

  .panel-caja { background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio); padding: 20px; box-shadow: var(--sombra); }

  /* Portada del panel (HUD) */
  .intro { position: relative; margin-bottom: 30px; padding: 26px 28px 24px; background: var(--hud-panel); border: 1px solid var(--hud-linea);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
  .intro::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--hud-ambar), transparent); }
  .intro-kicker { display: flex; align-items: center; gap: 8px; font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.26em; text-transform: uppercase; color: var(--hud-ambar); }
  .intro-kicker::before { content: ''; width: 8px; height: 8px; background: var(--hud-ambar); transform: rotate(45deg); }
  .intro h1 { margin: 8px 0 8px; font: 700 34px/1.05 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  .intro p { margin: 0; color: rgba(225, 235, 255, 0.78); max-width: 780px; }
  .intro p b { color: var(--hud-ambar); }
  .reglas { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-top: 18px; }
  .regla { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--hud-linea); background: rgba(255, 255, 255, 0.03);
    font: 600 12px 'Chakra Petch', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(235, 242, 255, 0.88); }
  .regla b { font: 11px 'Share Tech Mono', monospace; color: var(--hud-cian); font-weight: 400; }
  .objetivo-ok { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 16px; border: 1px solid var(--hud-cian); background: rgba(63, 224, 255, 0.08);
    font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--hud-blanco); }
  .objetivo-ok::before { content: ''; flex: none; width: 10px; height: 10px; background: var(--hud-cian); transform: rotate(45deg); box-shadow: 0 0 10px var(--hud-cian); }

  /* Bloques y tarjetas (HUD) */
  .bloque { margin-bottom: 30px; }
  .bloque-cab { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .bloque-hex { flex: none; width: 18px; height: 20px; background: var(--color-bloque); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); box-shadow: 0 0 12px var(--color-bloque); }
  .bloque-cab h2 { margin: 0; font: 700 18px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
  .bloque-linea { flex: 1; min-width: 40px; height: 1px; background: linear-gradient(90deg, var(--color-bloque), transparent); opacity: 0.6; }
  .bloque-cuenta { font: 13px 'Share Tech Mono', monospace; color: rgba(225, 235, 255, 0.7); }
  .bloque-cuenta b { color: var(--hud-ambar); font-weight: 400; }
  .bloque-parche { padding: 3px 9px; border: 1px solid var(--hud-linea); font: 600 10.5px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(225, 235, 255, 0.55); }
  .bloque-parche.ok { border-color: var(--color-bloque); color: var(--color-bloque); }
  .tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px; }
  .tarjeta {
    position: relative; text-align: left; color: var(--hud-blanco); font: inherit;
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px 18px 14px 20px;
    background: linear-gradient(160deg, rgba(18, 26, 48, 0.92), rgba(7, 11, 22, 0.92));
    border: 1px solid var(--hud-linea);
    clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
    cursor: pointer; transition: border-color .15s, background .15s, transform .15s;
  }
  .tarjeta::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--color-bloque); box-shadow: 0 0 10px var(--color-bloque); }
  .tarjeta::after { content: ''; position: absolute; top: 0; left: calc(100% - 16px); width: 22.6px; height: 1px; background: var(--hud-linea-fuerte); transform-origin: 0 0; transform: rotate(45deg); }
  .tarjeta:hover:not(:disabled) { border-color: var(--hud-blanco); background: linear-gradient(160deg, rgba(30, 42, 74, 0.95), rgba(10, 16, 32, 0.95)); transform: translateY(-2px); }
  .tarjeta:focus-visible { outline: 2px solid var(--hud-ambar); outline-offset: -2px; }
  .tarjeta:disabled { cursor: default; }
  .tarjeta-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tarjeta-codigo { font: 12px 'Share Tech Mono', monospace; color: var(--color-bloque); letter-spacing: 0.12em; }
  .tarjeta-titulo { display: flex; align-items: center; gap: 12px; }
  .tarjeta-icono { flex: none; display: grid; place-items: center; width: 40px; height: 44px; font-size: 20px; line-height: 1;
    background: rgba(255, 255, 255, 0.06); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .tarjeta h3 { margin: 0; font: 700 15.5px/1.2 'Chakra Petch', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
  .tarjeta p { margin: 0; color: rgba(215, 228, 255, 0.72); font-size: 13.5px; flex: 1; }
  .dificultad { color: var(--hud-ambar); letter-spacing: 3px; font-size: 14px; }
  .dificultad .apagada { color: rgba(255, 255, 255, 0.16); }
  .tarjeta-pie { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid rgba(200, 230, 255, 0.1);
    font: 600 11.5px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(215, 228, 255, 0.6); }
  .tarjeta-ir { color: var(--hud-blanco); transition: transform .15s; }
  .tarjeta:hover:not(:disabled) .tarjeta-ir { transform: translateX(4px); color: var(--hud-ambar); }
  .tarjeta.hecha { background: linear-gradient(160deg, rgba(14, 20, 36, 0.8), rgba(6, 9, 18, 0.8)); }
  .tarjeta.hecha h3, .tarjeta.hecha p, .tarjeta.hecha .tarjeta-icono { opacity: 0.6; }
  .tarjeta.hecha .tarjeta-pie { color: var(--color-bloque); }
  .tarjeta.hecha .tarjeta-pie .obtenidas { color: var(--hud-ambar); letter-spacing: 3px; }
  .tarjeta.curso { border-color: var(--hud-ambar); animation: pulsoCurso 1.8s ease-in-out infinite; }
  .tarjeta.curso .tarjeta-pie { color: var(--hud-ambar); }
  .tarjeta.curso .tarjeta-pie span:first-child::after { content: '_'; animation: parpadeo 1s steps(1) infinite; }
  @keyframes pulsoCurso { 50% { border-color: rgba(255, 185, 46, 0.35); } }

  /* Misión */
  .mision-cab { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .mision-icono { font-size: 40px; line-height: 1; }
  .mision-cab h1 { margin: 0; font-size: 28px; }
  .mision-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--suave); }
  .etiqueta-bloque { padding: 3px 10px; border-radius: 999px; font-weight: 700; color: #0b1020; font-size: 12px; }
  .en-curso { margin-left: auto; padding: 6px 12px; border-radius: 999px; background: rgba(255, 183, 3, 0.12); border: 1px solid rgba(255, 183, 3, 0.45); color: var(--acento); font-size: 13px; font-weight: 600; }
  .mision-grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px; align-items: start; }
  .historia { font-size: 16px; margin: 0 0 16px; }
  .datos-tit { font-size: 13px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 8px; }
  .datos { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
  .datos li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 12px; border-radius: 9px; background: var(--panel-2); font-size: 14px; }
  .datos li span:first-child { color: var(--suave); }
  .tabla-datos { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  .tabla-datos th, .tabla-datos td { padding: 7px 10px; border-bottom: 1px solid var(--borde); text-align: left; }
  .tabla-datos th { color: var(--suave); font-weight: 600; font-size: 13px; }
  .sim { position: relative; height: 320px; border-radius: 12px; overflow: hidden; background: #040816; border: 1px solid var(--borde); }
  .sim canvas { display: block; width: 100%; height: 100%; }

  .pregunta { padding: 16px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--borde); margin-bottom: 12px; }
  .pregunta-num { font-size: 12px; font-weight: 700; color: var(--acento); text-transform: uppercase; letter-spacing: .06em; }
  .pregunta-texto { margin: 4px 0 12px; font-weight: 600; }
  .entrada { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .entrada input {
    padding: 10px 12px; border-radius: 9px; border: 1px solid var(--borde-fuerte);
    background: rgba(0,0,0,0.3); color: var(--texto); font: 600 16px 'Inter', sans-serif;
  }
  .entrada input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  .in-mantisa { width: 120px; }
  .in-exp { width: 64px; }
  .por-diez { font-weight: 700; color: var(--suave); }
  .por-diez sup { font-size: 11px; }
  .unidad { font-weight: 600; color: var(--suave); }
  .vista-previa { margin-top: 8px; font-size: 13px; color: var(--suave); min-height: 18px; }
  .vista-previa.error { color: var(--mal); }
  .opciones { display: grid; gap: 8px; }
  .opcion { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--borde); cursor: pointer; }
  .opcion:hover { border-color: var(--borde-fuerte); }
  .opcion input { margin-top: 4px; accent-color: var(--acento); }
  .ayuda-formato { font-size: 13px; color: var(--suave); margin: 0 0 12px; }
  .enviar-zona { display: flex; justify-content: flex-end; margin-top: 6px; }

  /* Resultados */
  .resultado-cab { text-align: center; padding: 18px; margin-bottom: 14px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--borde); }
  .resultado-estrellas { font-size: 38px; letter-spacing: 6px; color: var(--acento); }
  .resultado-estrellas .apagada { color: rgba(255,255,255,0.15); }
  .resultado-estrellas span { display: inline-block; animation: pop .5s backwards; }
  @keyframes pop { from { transform: scale(0); opacity: 0; } 70% { transform: scale(1.3); } }
  .res-item { padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; border: 1px solid; }
  .res-item.ok { border-color: rgba(74, 222, 128, 0.45); background: rgba(74, 222, 128, 0.08); }
  .res-item.mal { border-color: rgba(248, 113, 113, 0.45); background: rgba(248, 113, 113, 0.08); }
  .res-item b { display: block; margin-bottom: 4px; }
  .res-linea { font-size: 14px; color: var(--suave); }
  .pasos { margin: 14px 0 0; padding-left: 20px; }
  .pasos li { margin-bottom: 10px; }
  .pasos .katex-display { margin: 4px 0; }

  /* Modal y aviso (HUD) */
  .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(2, 4, 12, 0.72); backdrop-filter: blur(4px); }
  .modal[hidden] { display: none; }
  .modal-caja {
    position: relative; width: min(540px, 100%); padding: 26px 26px 22px;
    background: linear-gradient(170deg, rgba(16, 24, 46, 0.98), rgba(6, 9, 18, 0.98)); border: 1px solid var(--hud-linea-fuerte);
    clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 18px 100%, 0 calc(100% - 18px));
    animation: modalEntra .25s ease-out;
  }
  .modal-caja::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--hud-ambar), transparent 70%); }
  @keyframes modalEntra { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
  .modal-caja h2 { margin: 0 0 10px; font: 700 21px/1.2 'Chakra Petch', sans-serif; letter-spacing: 0.1em; text-transform: uppercase; }
  .modal-caja p { color: rgba(220, 232, 255, 0.78); }
  .modal-caja p b { color: var(--hud-blanco); }
  .modal-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hud-ambar); }
  .modal-kicker::before { content: ''; width: 7px; height: 7px; background: currentColor; transform: rotate(45deg); }
  .modal-aviso { padding: 10px 12px; border-left: 2px solid var(--hud-magenta); background: rgba(255, 61, 127, 0.07); color: rgba(240, 225, 235, 0.9); font-size: 14px; }
  .modal-caja { max-height: calc(100vh - 32px); overflow-y: auto; }
  .modal-caja.modal-ancha { width: min(700px, 100%); }
  /* botón «Reglas» de la barra: manual de a bordo */
  .btn-reglas { display: inline-flex; align-items: center; gap: 9px; padding: 9px 16px 9px 12px; cursor: pointer;
    border: 1px solid rgba(255, 185, 46, 0.65); background: linear-gradient(160deg, rgba(255, 185, 46, 0.16), rgba(255, 185, 46, 0.03));
    color: var(--hud-ambar); font: 700 12px 'Chakra Petch', sans-serif; letter-spacing: 0.2em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    transition: background .15s, color .15s, box-shadow .15s; }
  .btn-reglas svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .btn-reglas:hover { background: var(--hud-ambar); color: #1a1100; box-shadow: 0 0 16px rgba(255, 185, 46, 0.45); }
  .btn-reglas:focus-visible { outline: 2px solid var(--hud-blanco); outline-offset: 2px; }
  /* ventana de ascenso de rango */
  .modal-caja.modal-ascenso { width: min(460px, 100%); text-align: center; }
  .ascenso .modal-kicker { justify-content: center; }
  .ascenso-galon { display: grid; place-items: center; margin: 6px 0 10px; animation: galonEntra 0.9s cubic-bezier(.2, 1.4, .4, 1) both; }
  .ascenso-galon canvas { filter: drop-shadow(0 0 14px rgba(255, 185, 46, 0.45)); }
  @keyframes galonEntra { 0% { transform: scale(0.2) rotate(-25deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  .ascenso h2 { margin-bottom: 6px; }
  .ascenso-objetivo { color: #7ee2a8 !important; }
  .ascenso-objetivo b { color: #7ee2a8 !important; }
  .ascenso-sig { font-size: 13.5px; }
  .modal-ascenso .modal-botones { justify-content: center; }
  .reglas-lista { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 9px; }
  .reglas-lista li { position: relative; padding-left: 18px; font-size: 14px; line-height: 1.45; color: rgba(220, 232, 255, 0.8); }
  .reglas-lista li::before { content: ''; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; background: var(--hud-cian); transform: rotate(45deg); }
  .reglas-lista b { color: var(--hud-blanco); }
  .reglas-escala { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-top: 6px; }
  .reglas-escala span { display: flex; flex-direction: column; gap: 2px; padding: 5px 6px; border: 1px solid rgba(255, 185, 46, 0.35); background: rgba(255, 185, 46, 0.06);
    font: 11px 'Share Tech Mono', monospace; color: rgba(220, 232, 255, 0.7); text-align: center; }
  .reglas-escala span b { font: 600 11.5px 'Chakra Petch', sans-serif; letter-spacing: 0.04em; color: var(--hud-ambar); }
  .reglas-escala span.cero { border-color: rgba(255, 61, 127, 0.35); background: rgba(255, 61, 127, 0.06); }
  .reglas-escala span.cero b { color: var(--hud-magenta); }
  .modal-botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .modal-botones .btn-mantener { flex: 0 1 280px; }
  .btn-hud.principal { background: var(--hud-ambar); border-color: var(--hud-ambar); color: #1a1100; }
  .btn-hud.principal:hover:not(:disabled) { background: #ffc94f; }
  .modal-lista { margin: 8px 0; padding-left: 18px; }
  .aviso {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; z-index: 60;
    padding: 12px 18px 12px 16px; max-width: calc(100% - 32px);
    background: rgba(24, 8, 18, 0.96); border: 1px solid rgba(255, 61, 127, 0.5); border-left: 3px solid var(--hud-magenta); color: #ffdbe7;
    font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.08em;
    transition: opacity .25s, transform .25s; pointer-events: none;
  }
  .aviso::before { content: 'Alerta · '; color: var(--hud-magenta); text-transform: uppercase; letter-spacing: 0.2em; }
  .aviso.visible { opacity: 1; transform: translate(-50%, 0); }
  .error-total { max-width: 560px; margin: 12vh auto; text-align: center; }

  .confeti { font-size: 60px; text-align: center; }

  /* =================================================================
   * Lenguaje visual tipo «No Man's Sky» (interfaz HUD retrofuturista)
   * ================================================================= */
  :root {
    --hud-cian: #3fe0ff;
    --hud-ambar: #ffb92e;
    --hud-magenta: #ff3d7f;
    --hud-blanco: #f4f7ff;
    --hud-linea: rgba(200, 230, 255, 0.22);
    --hud-linea-fuerte: rgba(200, 230, 255, 0.5);
    --hud-panel: rgba(7, 11, 22, 0.8);
    --hud-oscuro: #050811;
    --corte: 14px;
  }
  .hud { font-family: 'Chakra Petch', 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.14em; }
  .mono { font-family: 'Share Tech Mono', monospace; }

  /* Esquineros: cuatro corchetes en las esquinas de un bloque */
  .esquinas { position: absolute; inset: 10px; pointer-events: none; }
  .esquinas::before, .esquinas::after, .esquinas span::before, .esquinas span::after {
    content: ''; position: absolute; width: 18px; height: 18px; border: 2px solid var(--hud-blanco); opacity: 0.85;
  }
  .esquinas::before { top: 0; left: 0; border-right: 0; border-bottom: 0; }
  .esquinas::after { top: 0; right: 0; border-left: 0; border-bottom: 0; }
  .esquinas span::before { bottom: 0; left: 0; border-right: 0; border-top: 0; }
  .esquinas span::after { bottom: 0; right: 0; border-left: 0; border-top: 0; }

  /* ---------------------- Pantalla de carga ---------------------- */
  .carga {
    position: fixed; inset: 0; z-index: 40; overflow: hidden;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, #0b1430 0%, var(--hud-oscuro) 70%);
  }
  .carga-warp { position: absolute; inset: 0; width: 100%; height: 100%; }
  .carga::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
  }
  .carga-centro { position: relative; z-index: 2; text-align: center; padding: 0 16px; }
  .carga-hex { width: 132px; height: 132px; margin: 0 auto 26px; filter: drop-shadow(0 0 12px rgba(63,224,255,0.55)); }
  .carga-hex svg { width: 100%; height: 100%; overflow: visible; }
  .carga-hex polygon { fill: none; transform-origin: 60px 60px; }
  .hex-ext { stroke: var(--hud-cian); stroke-width: 2; stroke-dasharray: 22 10; animation: girar 4s linear infinite; }
  .hex-int { stroke: var(--hud-blanco); stroke-width: 1.5; stroke-dasharray: 6 6; animation: girar 2.6s linear infinite reverse; }
  .hex-nucleo { fill: var(--hud-ambar) !important; animation: latido 1.2s ease-in-out infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes latido { 50% { transform: scale(0.6); opacity: 0.6; } }
  .carga-titulo {
    position: relative; display: inline-block;
    font: 700 clamp(28px, 6vw, 54px)/1 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--hud-blanco); text-shadow: 0 0 18px rgba(63,224,255,0.45);
  }
  .carga-titulo::before, .carga-titulo::after {
    content: attr(data-texto); position: absolute; inset: 0; pointer-events: none;
  }
  .carga-titulo::before { color: var(--hud-cian); transform: translate(-2px, 0); clip-path: inset(0 0 60% 0); animation: glitch 3.2s steps(1) infinite; mix-blend-mode: screen; }
  .carga-titulo::after { color: var(--hud-magenta); transform: translate(2px, 0); clip-path: inset(55% 0 0 0); animation: glitch 2.7s steps(1) infinite reverse; mix-blend-mode: screen; }
  @keyframes glitch {
    0%, 86%, 100% { opacity: 0; }
    88% { opacity: 1; transform: translate(-4px, 1px); }
    92% { opacity: 1; transform: translate(3px, -1px); }
    95% { opacity: 0; }
  }
  .carga-sub { margin-top: 14px; font: 500 13px 'Chakra Petch', sans-serif; text-transform: uppercase; letter-spacing: 0.28em; color: var(--hud-cian); }
  .carga-sub::after { content: '_'; animation: parpadeo 1s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: 0; } }
  .carga-barra { width: min(320px, 70vw); height: 3px; margin: 22px auto 0; background: rgba(255,255,255,0.1); overflow: hidden; }
  .carga-barra span { display: block; width: 35%; height: 100%; background: linear-gradient(90deg, transparent, var(--hud-ambar), transparent); animation: barrido 1.3s ease-in-out infinite; }
  @keyframes barrido { from { transform: translateX(-100%); } to { transform: translateX(290%); } }
  .carga-log { list-style: none; margin: 22px auto 0; padding: 0; width: min(420px, 86vw); text-align: left; font: 13px 'Share Tech Mono', monospace; color: rgba(220,235,255,0.75); min-height: 80px; }
  .carga-log li { display: flex; justify-content: space-between; gap: 12px; animation: entrar .3s ease-out; }
  .carga-log li b { color: var(--hud-cian); font-weight: 400; }
  .carga-log li:not(:last-child) { opacity: 0.5; }
  @keyframes entrar { from { opacity: 0; transform: translateX(-8px); } }
  .carga-pie { position: absolute; bottom: 22px; left: 0; right: 0; z-index: 2; text-align: center; font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(220,235,255,0.45); }

  /* -------------- Editor: «Modificador de apariencia» -------------- */
  .mod { display: grid; grid-template-columns: minmax(270px, 0.72fr) minmax(440px, 1.28fr); grid-template-rows: clamp(640px, calc(100vh - 110px), 760px); gap: 18px; align-items: stretch; }
  .mod-escena {
    position: relative; height: 100%; min-height: 0; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 88%, rgba(63,224,255,0.16), transparent 70%),
      radial-gradient(circle at 50% 35%, #12204a 0%, #070c1d 60%, var(--hud-oscuro) 100%);
    border: 1px solid var(--hud-linea);
    clip-path: polygon(0 0, calc(100% - var(--corte)) 0, 100% var(--corte), 100% 100%, var(--corte) 100%, 0 calc(100% - var(--corte)));
  }
  .mod-escena canvas { position: absolute; inset: 0; display: block; cursor: grab; }
  .mod-escena canvas:active { cursor: grabbing; }
  .mod-escena::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
  }
  .mod-hud { position: absolute; left: 26px; right: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; pointer-events: none; z-index: 2; }
  .mod-hud-sup { top: 24px; align-items: flex-start; }
  .mod-hud-inf { bottom: 22px; }
  .mod-etq { font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--hud-cian); }
  .mod-hud-sup > div:first-child { flex: 1; min-width: 0; }
  .mod-nombre { font: 700 clamp(16px, 1.6vw, 22px)/1.1 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--hud-blanco); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mod-hud-sup .mod-dato { flex: none; }
  .mod-dato { text-align: right; font: 12px 'Share Tech Mono', monospace; color: rgba(220,235,255,0.7); line-height: 1.5; }
  .mod-dato b { color: var(--hud-ambar); font-weight: 400; }
  .mod-rotar { font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(220,235,255,0.6); white-space: nowrap; }
  @media (min-width: 861px) and (max-width: 1240px) { .mod-hud-inf .mod-dato { display: none; } }

  .mod-panel {
    position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden;
    background: var(--hud-panel); border: 1px solid var(--hud-linea); backdrop-filter: blur(6px);
    clip-path: polygon(var(--corte) 0, 100% 0, 100% calc(100% - var(--corte)), calc(100% - var(--corte)) 100%, 0 100%, 0 var(--corte));
  }
  .mod-cab { padding: 22px 24px 16px; border-bottom: 1px solid var(--hud-linea); }
  .mod-kicker { display: flex; align-items: center; gap: 8px; font: 500 11px 'Chakra Petch', sans-serif; letter-spacing: 0.26em; text-transform: uppercase; color: var(--hud-ambar); }
  .mod-kicker::before { content: ''; width: 8px; height: 8px; background: var(--hud-ambar); transform: rotate(45deg); }
  .mod-cab h1 { margin: 8px 0 6px; font: 700 26px/1.1 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  .mod-cab p { margin: 0; color: rgba(220,235,255,0.7); font-size: 14px; }

  .mod-tabs { display: flex; flex-wrap: nowrap; gap: 4px; padding: 14px 24px 0; }
  .mod-tab {
    position: relative; flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    padding: 14px 3px 9px; border: 1px solid var(--hud-linea); background: rgba(255,255,255,0.03);
    color: rgba(230,240,255,0.8); cursor: pointer; text-align: center;
    font: 600 10.5px/1.15 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
    transition: background .15s, color .15s, border-color .15s;
  }
  .mod-tab-num { position: absolute; top: 3px; left: 5px; font: 9px 'Share Tech Mono', monospace; letter-spacing: 0.05em; color: var(--hud-cian); opacity: 0.75; }
  .mod-tab-ico { flex: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .mod-tab-txt { overflow-wrap: anywhere; hyphens: auto; }
  .mod-tab:hover { border-color: var(--hud-linea-fuerte); color: #fff; }
  .mod-tab:hover .mod-tab-ico { color: var(--hud-cian); }
  .mod-tab.activa { background: var(--hud-blanco); color: #08101f; border-color: var(--hud-blanco); }
  .mod-tab.activa .mod-tab-ico { color: #08101f; }
  .mod-tab.activa .mod-tab-num { color: #08101f; opacity: 0.5; }
  .mod-tab:focus-visible, .tesela:focus-visible, .hexa:focus-visible, .btn-hud:focus-visible { outline: 2px solid var(--hud-ambar); outline-offset: 2px; }

  .mod-cuerpo { flex: 1; padding: 18px 24px; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--hud-linea-fuerte) transparent; }
  .mod-seccion { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; }
  .mod-seccion::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hud-linea-fuerte), transparent); }
  .mod-seccion span { color: var(--hud-cian); font: 12px 'Share Tech Mono', monospace; }

  .teselas { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .tesela {
    position: relative; padding: 16px 12px 14px; text-align: left; cursor: pointer;
    background: rgba(255,255,255,0.04); border: 1px solid var(--hud-linea); color: var(--hud-blanco);
    font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    transition: background .15s, border-color .15s, color .15s, transform .15s;
  }
  .tesela small { display: block; margin-bottom: 6px; font: 10px 'Share Tech Mono', monospace; color: var(--hud-cian); letter-spacing: 0.1em; }
  .tesela:hover { border-color: var(--hud-linea-fuerte); background: rgba(255,255,255,0.08); }
  .tesela.activa { background: var(--hud-blanco); color: #08101f; border-color: var(--hud-blanco); }
  .tesela.activa small { color: #08101f; opacity: 0.55; }
  .tesela.activa::after { content: ''; position: absolute; right: 10px; bottom: 10px; width: 7px; height: 7px; background: var(--hud-ambar); transform: rotate(45deg); }

  .hexas { display: grid; grid-template-columns: repeat(auto-fill, 62px); gap: 10px 8px; }
  .hexa { width: 62px; padding: 0; border: 0; background: none; cursor: pointer; color: rgba(230,240,255,0.75); text-align: center; }
  .hexa-forma { display: grid; place-items: center; width: 54px; height: 60px; margin: 0 auto; background: rgba(200,230,255,0.25); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: background .15s, transform .15s; }
  .hexa-color { width: 46px; height: 52px; clip-path: inherit; box-shadow: inset 0 -10px 16px rgba(0,0,0,0.25); }
  .hexa:hover .hexa-forma { transform: scale(1.06); }
  .hexa.activa .hexa-forma { background: var(--hud-blanco); }
  .hexa-nombre { display: block; margin-top: 5px; font: 500 9.5px/1.25 'Chakra Petch', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; }
  .hexa.activa .hexa-nombre { color: var(--hud-ambar); }

  .campo-hud {
    width: 100%; padding: 14px 16px; border: 1px solid var(--hud-linea-fuerte); background: rgba(0,0,0,0.35); color: var(--hud-blanco);
    font: 600 20px 'Chakra Petch', sans-serif; letter-spacing: 0.14em; text-transform: uppercase;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  }
  .campo-hud:focus { outline: none; border-color: var(--hud-ambar); box-shadow: inset 0 0 0 1px var(--hud-ambar); }
  .campo-ayuda { margin: 10px 0 0; font-size: 13px; color: rgba(220,235,255,0.6); }

  .mod-desc { margin: 0 24px; padding: 12px 14px; border-left: 2px solid var(--hud-ambar); background: rgba(255,185,46,0.06); font-size: 13.5px; color: rgba(230,240,255,0.8); flex: none; min-height: 68px; }
  .mod-desc b { font: 600 12px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: var(--hud-ambar); margin-right: 6px; }

  .mod-acciones { display: flex; flex-wrap: wrap; gap: 8px; padding: 18px 24px 22px; align-items: stretch; }
  .btn-hud {
    position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 13px 18px; cursor: pointer; border: 1px solid var(--hud-linea-fuerte); background: rgba(255,255,255,0.04); color: var(--hud-blanco);
    font: 600 13px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase;
    transition: background .15s, border-color .15s;
  }
  .btn-hud:hover:not(:disabled) { background: rgba(255,255,255,0.1); border-color: var(--hud-blanco); }
  .btn-hud:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-mantener {
    flex: 1; min-width: 220px; border-color: var(--hud-ambar); color: var(--hud-ambar);
    -webkit-user-select: none; user-select: none; touch-action: none;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-mantener .relleno { position: absolute; inset: 0; width: 0; background: var(--hud-ambar); }
  .btn-mantener .txt, .btn-mantener .icono { position: relative; z-index: 1; }
  .btn-mantener .icono { width: 18px; height: 18px; }
  .btn-mantener.activo .txt, .btn-mantener.activo .icono { color: #1a1100; mix-blend-mode: normal; }
  .btn-mantener.hecho { background: var(--hud-ambar); color: #1a1100; }

  @media (max-width: 860px) {
    .mod { grid-template-columns: 1fr; grid-template-rows: 420px auto; }
    .mod-panel { height: auto; overflow: visible; }
    .mod-cuerpo { overflow: visible; }
    .mod-cab, .mod-cuerpo { padding-left: 16px; padding-right: 16px; }
    .mod-tabs { padding: 12px 16px 0; }
    .mod-desc { margin: 0 16px; }
    .mod-acciones { padding: 16px; }
    .mod-hud { left: 18px; right: 18px; }
  }
  @media (max-width: 560px) {
    /* En móvil las pestañas se quedan solo con icono (el nombre aparece debajo, en la sección) */
    .mod-tab-txt { display: none; }
    .mod-tab { padding: 14px 0 10px; }
  }

  @media (max-width: 860px) {
    .mision-grid, .editor { grid-template-columns: 1fr; }
    .editor-escena { min-height: 360px; }
    .barra { flex-wrap: wrap; padding: 10px 16px; }
    .barra-progreso { order: 3; flex-basis: 100%; max-width: none; }
    .app { padding: 18px 16px 50px; }
    .intro h1 { font-size: 24px; }
  }

  /* ------------- Panel: registro de misiones en una tablet ------------- */
  .quest { padding-top: 4px; }
  .quest-escena { position: relative; padding: 16px 96px 92px; animation: flotar 7s ease-in-out infinite; }
  @keyframes flotar {
    0%, 100% { transform: translateY(0) rotate(-0.25deg); }
    50% { transform: translateY(-7px) rotate(0.25deg); }
  }
  @media (prefers-reduced-motion: reduce) { .quest-escena { animation: none; } }
  .manos-capa { position: absolute; inset: 0; pointer-events: none; }
  .manos-capa canvas { display: block; }
  .manos-atras { z-index: 0; }
  .manos-delante { z-index: 2; }

  .tablet {
    position: relative; z-index: 1;
    height: clamp(540px, calc(100vh - 240px), 720px);
    padding: 24px 28px 34px;
    border-radius: 36px;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.08), transparent 30%),
      linear-gradient(160deg, #2b3243, #161b27 55%, #0d1018);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.14), inset 0 -4px 0 rgba(0,0,0,0.55),
      inset 0 0 0 1px rgba(255,255,255,0.05),
      0 0 0 2px #090c12, 0 34px 70px rgba(0,0,0,0.65);
  }
  /* topes de goma en las esquinas */

  .tablet-marca { position: absolute; bottom: 9px; left: 0; right: 0; text-align: center; pointer-events: none;

  .pantalla {
    position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden;

  .pantalla-cab { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--hud-linea); background: rgba(255,255,255,0.02); }

  .pantalla-ok { padding: 3px 9px; border: 1px solid var(--hud-cian); color: var(--hud-cian); font: 600 10.5px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; }
  .pantalla-iconos { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .pantalla-hora { font: 400 13px 'Share Tech Mono', monospace; color: var(--hud-cian); letter-spacing: 0.06em; }
  .ico-senal { width: 20px; height: 14px; fill: var(--hud-cian); }
  .ico-senal rect:first-child { opacity: 0.95; }
  .ico-bateria { width: 30px; height: 14px; }

  .lista { overflow-y: auto; padding: 10px 10px 16px; border-right: 1px solid var(--hud-linea);
    scrollbar-width: thin; scrollbar-color: var(--hud-linea-fuerte) transparent; }
  .lista-sep { display: flex; align-items: center; gap: 8px; margin: 10px 6px 6px; font: 600 10.5px 'Chakra Petch', sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(220,232,255,0.5); }
  .lista-sep span { color: var(--hud-ambar); letter-spacing: 2px; }
  .lista-sep::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--hud-linea-fuerte), transparent); }
  .lista-item {
    width: 100%; display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px;

  .li-codigo { font: 10.5px 'Share Tech Mono', monospace; color: rgba(220,232,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .li-codigo .dificultad { font-size: 10px; letter-spacing: 1px; }
  .lista-item.sel .li-codigo { color: rgba(26,17,0,0.62); }
  .li-nueva, .li-curso, .li-hecha { font: 600 10px 'Chakra Petch', sans-serif; letter-spacing: 0.14em; text-transform: uppercase; white-space: nowrap; }
  .li-nueva { color: var(--hud-cian); }
  .li-curso { color: var(--hud-ambar); }
  .li-curso::before { content: '● '; animation: parpadeo 1.2s steps(1) infinite; }
  .li-hecha { color: #7ee2a8; font-size: 12px; letter-spacing: 0.04em; }

  .lista-item.sel .li-curso { color: #1a1100; }
  .lista-item.sel .li-hecha { color: #0e4d27; }
  /* misiones completadas: bloqueadas, apagadas y con el color de su resultado
     (--res: verde = todas las estrellas · ámbar = éxito parcial · magenta = sin estrellas) */
  .lista-item.hecha { --res: 126, 226, 168; cursor: default;
    background: repeating-linear-gradient(135deg, rgba(var(--res), 0.06) 0 6px, transparent 6px 12px); border-color: rgba(var(--res), 0.2); }
  .lista-item.hecha.parcial { --res: 255, 185, 46; }
  .lista-item.hecha.fallo { --res: 255, 61, 127; }
  .lista-item.hecha:hover { background: repeating-linear-gradient(135deg, rgba(var(--res), 0.06) 0 6px, transparent 6px 12px); border-color: rgba(var(--res), 0.2); }
  .lista-item.hecha::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: rgb(var(--res)); opacity: 0.8; }
  .lista-item.hecha { position: relative; }
  .lista-item.hecha .li-icono { background: rgba(var(--res), 0.18); color: rgb(var(--res)); font-weight: 700; font-size: 16px; }
  .lista-item.hecha .li-titulo { color: rgba(235,242,255,0.5); text-decoration: line-through; text-decoration-color: rgba(var(--res), 0.6); }
  .lista-item.hecha .li-codigo { color: rgba(var(--res), 0.7); }
  .lista-item.hecha .li-codigo::after { content: ' · Completada'; }
  .lista-item.hecha.parcial .li-codigo::after { content: ' · Éxito parcial'; }
  .lista-item.hecha.fallo .li-codigo::after { content: ' · Fallida'; }
  .lista-item.hecha .li-hecha { color: rgb(var(--res)); }
  .lista-item.hecha .li-hecha .dificultad { color: rgb(var(--res)); }
  /* tooltip HUD de las misiones completadas (mismo código de color --res) */
  .tip { --res: 126, 226, 168; --flecha: 50%; position: fixed; z-index: 60; min-width: 190px; padding: 10px 14px 10px 16px;
    background: rgba(5, 8, 17, 0.94); border: 1px solid rgba(var(--res), 0.55); border-left: 3px solid rgb(var(--res));
    box-shadow: 0 0 18px rgba(var(--res), 0.22), 0 8px 24px rgba(0,0,0,0.5); color: var(--hud-blanco);
    pointer-events: none; opacity: 0; transform: translateX(-6px); transition: opacity .12s, transform .12s; }
  .tip.visible { opacity: 1; transform: none; }
  .tip.parcial { --res: 255, 185, 46; }
  .tip.fallo { --res: 255, 61, 127; }
  .tip.ayuda { --res: 63, 224, 255; min-width: 0; padding: 7px 12px 7px 13px; }
  .tip.ayuda .tip-texto { color: var(--hud-blanco); }

  .tip::before { content: ''; position: absolute; left: -10px; top: calc(var(--flecha) - 6px); border: 6px solid transparent; border-right: 7px solid rgb(var(--res)); }
  .tip::after { content: ''; position: absolute; top: -1px; right: -1px; width: 10px; height: 10px;
    border-top: 2px solid rgb(var(--res)); border-right: 2px solid rgb(var(--res)); }
  .tip-cab { display: flex; align-items: center; gap: 8px; font: 700 12px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(var(--res)); }
  .tip-icono { display: grid; place-items: center; width: 20px; height: 22px; font-size: 12px; background: rgba(var(--res), 0.18);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  .tip-estrellas { margin: 8px 0 2px; font-size: 20px; letter-spacing: 4px; color: rgb(var(--res)); }
  .tip-texto { font: 12px 'Share Tech Mono', monospace; color: rgba(235,242,255,0.85); }
  .tip-pie { margin-top: 8px; padding-top: 6px; border-top: 1px solid rgba(var(--res), 0.25);
    font: 600 9.5px 'Chakra Petch', sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(220,232,255,0.5); }
  .ficha-vacia { margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; color: rgba(225,235,255,0.8); }

  .ficha { overflow-y: auto; padding: 22px 28px 20px; display: flex; flex-direction: column; gap: 18px;
    scrollbar-width: thin; scrollbar-color: var(--hud-linea-fuerte) transparent; animation: fichaEntra .25s ease-out; }

  .ficha-cab { display: flex; gap: 18px; align-items: center; }

  /* imagen ilustrativa de la misión, a la derecha del texto (proporción 3:4) */
  .ficha-contenido { display: grid; grid-template-columns: minmax(0, 1fr) 36%; gap: 20px; align-items: start; }
  .ficha-texto { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  .imagen-hueco small { font: 12px 'Share Tech Mono', monospace; letter-spacing: 0.06em; color: var(--hud-cian); }

  .hangar-estado { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid rgba(255, 185, 46, 0.4); background: rgba(255, 185, 46, 0.06);
